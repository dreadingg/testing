let pomoInt=null, pomoSec=1500;
function pomoStart(min){
    pomoStop();
    pomoSec=min*60;
    pomoInt=setInterval(()=>{
        pomoSec--;
        const m=Math.floor(pomoSec/60), s=pomoSec%60;
        const el=document.getElementById('pomoTime');
        if(el)el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
        if(pomoSec<=0){pomoStop();alert('Time is up!');}
    },1000);
    const el=document.getElementById('pomoTime');
    if(el)el.textContent=String(min).padStart(2,'0')+':00';
}
function pomoStop(){if(pomoInt)clearInterval(pomoInt);pomoInt=null;}
function openConverter(){
    const html=`<div class="school-wrap">
        <h2>Unit Converter</h2>
        <label>Value</label><input type="number" id="convVal" value="1">
        <label>From</label>
        <select id="convFrom">
            <option value="m">Meters</option><option value="km">Kilometers</option>
            <option value="ft">Feet</option><option value="mi">Miles</option>
            <option value="kg">Kilograms</option><option value="lb">Pounds</option>
            <option value="c">Celsius</option><option value="f">Fahrenheit</option>
        </select>
        <label>To</label>
        <select id="convTo">
            <option value="ft">Feet</option><option value="m">Meters</option>
            <option value="km">Kilometers</option>
            <option value="mi">Miles</option><option value="kg">Kilograms</option>
            <option value="lb">Pounds</option><option value="c">Celsius</option>
            <option value="f">Fahrenheit</option>
        </select>
        <button onclick="doConvert()">Convert</button>

    </div>`;

function doConvert(){
    const v=parseFloat(document.getElementById('convVal').value);
    const from=document.getElementById('convFrom').value;
    const to=document.getElementById('convTo').value;
    const r=document.getElementById('convResult');
    if(isNaN(v)){r.textContent='Invalid value.';return;}
    const toM={m:1,km:1000,ft:0.3048,mi:1609.34};
    const toKg={kg:1,lb:0.453592};
    let out=null;
    if(toM[from]&&toM[to])out=v*toM[from]/toM[to];
    else if(toKg[from]&&toKg[to])out=v*toKg[from]/toKg[to];
    else if(from==='c'&&to==='f')out=v*9/5+32;
    else if(from==='f'&&to==='c')out=(v-32)*5/9;
    else out=null;
    r.textContent = out===null ? 'Unsupported conversion.' : v+' '+from+' = '+out.toFixed(4)+' '+to;
}

function checkTyping(target){

    const html=`<div class="school-wrap">

function calcGPA(){
    const grades=document.getElementById('gpaGrades').value.split(',').map(s=>s.trim().toUpperCase());
    const credits=[3,3,4];
    const map={'A+':4.3,'A':4.0,'A-':3.7,'B+':3.3,'B':3.0,'B-':2.7,'C+':2.3,'C':2.0,'C-':1.7,'D':1.0,'F':0};
    let total=0, tc=0;
    for(let i=0;i<grades.length;i++){
        const g=map[grades[i]];
        const c=credits[i]||3;
        if(g!==undefined){total+=g*c;tc+=c;}
    }
    const r=document.getElementById('gpaResult');
    r.textContent = tc? 'Weighted GPA: '+(total/tc).toFixed(3) : 'No valid grades.';
}

    const html=`

                <button class="fn" onclick="calcFn('sqrt(')">√</button>
                <button class="fn" onclick="calcFn('^')">^</button>
                <button class="fn" onclick="calcFn('pi')">π</button>
                <button class="fn" onclick="calcFn('e')">e</button>
                <button class="fn" onclick="calcFn('!')">n!</button>
                <button onclick="calcNum('7')">7</button>
                <button onclick="calcNum('8')">8</button>
                <button onclick="calcNum('9')">9</button>
                <button class="op" onclick="calcOp('/')">÷</button>
                <button class="op" onclick="calcOp('*')">×</button>
                <button onclick="calcNum('4')">4</button>
                <button onclick="calcNum('5')">5</button>
                <button onclick="calcNum('6')">6</button>
                <button class="op" onclick="calcOp('-')">−</button>
                <button class="fn" onclick="calcFn('(')">(</button>
                <button onclick="calcNum('1')">1</button>
                <button onclick="calcNum('2')">2</button>
                <button onclick="calcNum('3')">3</button>
                <button class="op" onclick="calcOp('+')">+</button>
                <button class="fn" onclick="calcFn(')')">)</button>
                <button onclick="calcNum('0')">0</button>
                <button onclick="calcNum('.')">.</button>
                <button class="fn" onclick="calcFn('x')">x</button>
                <button class="fn" onclick="calcFn('y')">y</button>
                <button class="eq" onclick="calcEq()" style="grid-row:span 1;grid-column:span 1">=</button>
                <button onclick="calcClear()" class="fn">AC</button>
                <button onclick="calcDel()" class="fn">⌫</button>
                <button class="fn" onclick="calcFn('=')">ANS</button>
                <button class="op" onclick="calcOp('%')">%</button>
            </div>
            <div class="calc-help">Supports: + − × ÷ ^ % √ sin cos tan log ln π e ( ) x y !</div>
        </div>`;
    createWindow('calculator','Calculator',420,620,html,'calculator');
    window._calcHist = JSON.parse(localStorage.getItem('dreados_calc_hist') || '[]');
    window._calcVars = {x:1, y:2, ans:0};
    renderCalcHist();
    calcUpdate();
}
function calcNum(n){const d=document.getElementById('cd');if(!d)return;d.textContent=(d.textContent==='0'?n:d.textContent+n);calcUpdate();}
function calcOp(o){const d=document.getElementById('cd');if(!d)return;d.textContent+=o;calcUpdate();}
function calcFn(f){const d=document.getElementById('cd');if(!d)return;
    if(f==='pi'){d.textContent=d.textContent==='0'?'pi':d.textContent+'pi';}
    else if(f==='e'){d.textContent=d.textContent==='0'?'e':d.textContent+'e';}
    else if(f==='='){d.textContent=d.textContent==='0'?'ans':d.textContent+'ans';}
    else if(f==='x'||f==='y'){d.textContent=d.textContent==='0'?f:d.textContent+f;}
    else if(f==='!'){d.textContent+='!';}
    else {d.textContent=d.textContent==='0'?f:d.textContent+f;}
    calcUpdate();
}
function calcClear(){const d=document.getElementById('cd');if(!d)return;d.textContent='0';const p=document.getElementById('cp');if(p)p.textContent='';}
function calcDel(){const d=document.getElementById('cd');if(!d)return;if(d.textContent.length<=1)d.textContent='0';else d.textContent=d.textContent.slice(0,-1);calcUpdate();}
function calcUpdate(){
    const d=document.getElementById('cd');const p=document.getElementById('cp');
    if(!d||!p)return;
    const expr=d.textContent;
    if(expr==='0'){p.textContent='';return;}
    try{const v=parseCalc(expr,window._calcVars);if(v!==null&&isFinite(v))p.textContent='= '+Math.round(v*1e10)/1e10;else p.textContent='';}
    catch(e){p.textContent='';}
}
function calcEq(){
    const d=document.getElementById('cd');if(!d)return;
    const expr=d.textContent;
    try{
        const v=parseCalc(expr,window._calcVars);
        if(v===null||!isFinite(v)){d.textContent='Error';return;}
        const rounded=Math.round(v*1e10)/1e10;
        window._calcVars.ans=rounded;
        window._calcHist.unshift({in:expr,out:String(rounded)});
        window._calcHist=window._calcHist.slice(0,20);
        localStorage.setItem('dreados_calc_hist',JSON.stringify(window._calcHist));
        renderCalcHist();
        d.textContent=String(rounded);
        const p=document.getElementById('cp');if(p)p.textContent='';
    }catch(e){d.textContent='Error';}
}
function renderCalcHist(){
    const h=document.getElementById('calcHist');if(!h)return;
    h.innerHTML=window._calcHist.map(r=>`<div class="row"><span class="in">${r.in}</span><span class="out">${r.out}</span></div>`).join('');
}
function parseCalc(expr,vars){
    vars=vars||{};
    let s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'').replace(/sqrt/g,'√');
    s=s.replace(/(\d)(pi|e|x|y|ans|√|sin|cos|tan|log|ln|\()/g,'$1*$2');
    s=s.replace(/(pi|e|x|y|ans|\))(\d|pi|e|x|y|ans|√|sin|cos|tan|log|ln|\()/g,'$1*$2');
    let pos=0;
    function peek(){return s[pos];}
    function match(c){if(s.substr(pos,c.length)===c){pos+=c.length;return true;}return false;}
    function parseExpr(){let v=parseTerm();while(pos<s.length){if(match('+'))v+=parseTerm();else if(match('-'))v-=parseTerm();else break;}return v;}
    function parseTerm(){let v=parsePow();while(pos<s.length){if(match('*'))v*=parsePow();else if(match('/')){const d=parsePow();v=d===0?NaN:v/d;}else if(match('%'))v%=parsePow();else break;}return v;}
    function parsePow(){let v=parseFactor();if(match('^'))v=Math.pow(v,parsePow());return v;}
    function parseFactor(){let v=parseUnary();while(peek()==='!'){pos++;v=factorial(v);}return v;}
    function parseUnary(){if(match('-'))return -parseUnary();if(match('+'))return parseUnary();return parsePrimary();}
    function parsePrimary(){
        if(peek()==='('){pos++;const v=parseExpr();if(peek()===')')pos++;return v;}
        if(match('pi'))return Math.PI;
        if(match('e')&&!/[a-z]/.test(s[pos]||''))return Math.E;
        if(match('ans'))return vars.ans||0;
        if(match('x'))return vars.x||0;
        if(match('y'))return vars.y||0;
        if(match('√'))return Math.sqrt(parsePrimary());
        if(match('sin'))return Math.sin(parsePrimary());
        if(match('cos'))return Math.cos(parsePrimary());
        if(match('tan'))return Math.tan(parsePrimary());
        if(match('log'))return Math.log10(parsePrimary());
        if(match('ln'))return Math.log(parsePrimary());
        let start=pos;
        while(pos<s.length&&/[\d.]/.test(s[pos]))pos++;
        if(pos>start)return parseFloat(s.slice(start,pos));
        throw new Error('Parse error at '+pos);
    }
    function factorial(n){if(n<0||!Number.isInteger(n))return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
    const result=parseExpr();
    if(pos!==s.length)throw new Error('Trailing input');
    return result;
}
