<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dreadOS</title>
<style>
:root{
    --accent:#7ab8ff;
    --accent-2:#a04bd4;
    --bg-1:#1a0f2e; --bg-2:#12082a; --bg-3:#0a0a1e; --bg-4:#05050d;
    --win-bg:rgba(18,18,26,.94);
    --win-bg-light:rgba(240,240,245,.96);
    --text:#e0e0e0;
    --text-light:#1a1a20;
    --border:rgba(255,255,255,.08);
    --blur:22px;
    --dock-scale:1;
    --ui-scale:0.75;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;color:var(--text);user-select:none;-webkit-font-smoothing:antialiased}
body.light{color:var(--text-light)}

/* BOOT */
#boot{position:fixed;inset:0;background:#05050a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s cubic-bezier(.4,0,.2,1),visibility .9s}
#boot.hidden{opacity:0;visibility:hidden;pointer-events:none}
.boot-logo{font-size:calc(2.8rem * var(--ui-scale));font-weight:200;letter-spacing:10px;color:#fff;margin-bottom:6px}
.boot-sub{font-size:calc(.7rem * var(--ui-scale));color:#444;letter-spacing:4px;margin-bottom:44px}
.boot-bar{width:260px;height:2px;background:#15151e;border-radius:2px;overflow:hidden}
.boot-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),#4a7c59,var(--accent));transition:width .3s cubic-bezier(.4,0,.2,1)}
.boot-status{font-size:calc(.68rem * var(--ui-scale));color:#333;margin-top:16px;font-family:'Courier New',monospace;letter-spacing:1px}

/* DESKTOP */
#desktop{position:absolute;inset:0;overflow:hidden;
    background:
        radial-gradient(ellipse 60% 80% at 15% 40%, rgba(160,75,212,.55), transparent 60%),
        radial-gradient(ellipse 50% 70% at 5% 80%, rgba(220,120,180,.45), transparent 60%),
        radial-gradient(ellipse 55% 65% at 30% 15%, rgba(90,60,180,.55), transparent 60%),
        radial-gradient(ellipse 45% 55% at 85% 20%, rgba(30,40,90,.7), transparent 65%),
        radial-gradient(ellipse 60% 80% at 90% 85%, rgba(20,25,60,.85), transparent 65%),
        linear-gradient(110deg, var(--bg-1) 0%, var(--bg-2) 25%, var(--bg-3) 55%, var(--bg-4) 85%);
    background-size:200% 200%;animation:bgShift 30s ease infinite}
#desktop.wallpaper{animation:none;background-size:cover;background-position:center}
#desktop.no-anim{animation:none}
#desktop.no-anim::before{animation:none}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#desktop::before{content:"";position:absolute;inset:-20%;pointer-events:none;
    background:radial-gradient(circle at 25% 55%,rgba(200,120,220,.25),transparent 35%),
               radial-gradient(circle at 45% 75%,rgba(120,60,200,.20),transparent 40%);
    filter:blur(40px);animation:blobMove 22s ease-in-out infinite alternate}
@keyframes blobMove{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(6%,-4%,0) scale(1.08)}}

/* TOPBAR */
#topbar{position:absolute;top:0;left:0;right:0;height:calc(30px * var(--ui-scale));background:rgba(10,10,18,.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:14px;font-size:calc(.7rem * var(--ui-scale));color:#aaa;z-index:900}
#topbar .brand{font-weight:600;color:#fff;letter-spacing:1.5px}
#topbar .spacer{flex:1}
#topbar .tray{display:flex;gap:12px;align-items:center;color:#999}
#topbar .chip{background:rgba(255,255,255,.06);padding:3px 9px;border-radius:10px;font-size:calc(.65rem * var(--ui-scale))}

/* DOCK */
#dock{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(15,15,25,.55);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border);border-radius:18px;padding:8px 12px;display:flex;gap:6px;z-index:900;box-shadow:0 12px 45px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05);max-width:95vw;overflow-x:auto}
.dock-icon{width:calc(42px * var(--dock-scale));height:calc(42px * var(--dock-scale));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:calc(1.05rem * var(--dock-scale));cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.04);transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .2s ease;position:relative;flex-shrink:0}
.dock-icon:hover{transform:translate3d(0,-9px,0) scale(1.1);background:rgba(255,255,255,.14)}
.dock-icon::after{content:attr(data-label);position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:calc(.6rem * var(--ui-scale));color:#ddd;background:rgba(0,0,0,.85);padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .18s ease}
.dock-icon:hover::after{opacity:1}
.dock-sep{width:1px;background:var(--border);margin:6px 3px;flex-shrink:0}
.dock-indicator{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s ease}
.dock-icon.has-window .dock-indicator{opacity:.7}

/* WINDOWS */
.window{position:absolute;background:var(--win-bg);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.7);display:flex;flex-direction:column;min-width:280px;min-height:180px;opacity:0;transform:translate3d(0,12px,0) scale(.94);font-size:calc(.75rem * var(--ui-scale));
    transition:opacity .28s cubic-bezier(.4,0,.2,1),transform .32s cubic-bezier(.34,1.4,.64,1),width .28s cubic-bezier(.4,0,.2,1),height .28s cubic-bezier(.4,0,.2,1),left .28s cubic-bezier(.4,0,.2,1),top .28s cubic-bezier(.4,0,.2,1)}
body.light .window{background:var(--win-bg-light);color:var(--text-light);border-color:rgba(0,0,0,.08)}
.window.dragging,.window.resizing{transition:opacity .28s cubic-bezier(.4,0,.2,1),transform .32s cubic-bezier(.34,1.4,.64,1)}
.window.open{opacity:1;transform:translate3d(0,0,0) scale(1)}
.window.closing{opacity:0;transform:translate3d(0,8px,0) scale(.93)}
.window.minimizing{opacity:0;transform:translate3d(0,400px,0) scale(.15);transition:opacity .28s ease,transform .34s cubic-bezier(.5,0,.7,.4)}
.window.fullscreen{border-radius:0;left:0 !important;top:calc(30px * var(--ui-scale)) !important;width:100vw !important;height:calc(100vh - 30px * var(--ui-scale)) !important}
.window.fullscreen .window-header{cursor:default}
.window-header{height:calc(34px * var(--ui-scale));background:rgba(255,255,255,.03);display:flex;align-items:center;padding:0 12px;gap:10px;cursor:grab;user-select:none;border-bottom:1px solid var(--border);flex-shrink:0;touch-action:none}
body.light .window-header{background:rgba(0,0,0,.02);border-bottom-color:rgba(0,0,0,.06)}
.window-header:active{cursor:grabbing}
.window.fullscreen .window-header:active{cursor:default}
.window-dots{display:flex;gap:8px;align-items:center}
.dot{width:calc(12px * var(--ui-scale));height:calc(12px * var(--ui-scale));border-radius:50%;cursor:pointer;position:relative;transition:filter .15s ease,transform .15s cubic-bezier(.34,1.56,.64,1)}
.dot::before{content:"";position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(8px * var(--ui-scale));font-weight:900;color:rgba(0,0,0,.55);line-height:calc(12px * var(--ui-scale));text-align:center;opacity:0;transition:opacity .12s ease}
.window-header:hover .dot::before{opacity:1}
.dot.red{background:#ff5f57}.dot.red::before{content:"✕"}
.dot.yellow{background:#febc2e}.dot.yellow::before{content:"−"}
.dot.green{background:#28c840}.dot.green::before{content:"+";font-size:calc(10px * var(--ui-scale))}
.dot:hover{filter:brightness(1.2)}.dot:active{transform:scale(.9)}
.window-title{flex:1;font-size:calc(.74rem * var(--ui-scale));color:#ccc;font-weight:500;letter-spacing:.3px;text-align:center}
body.light .window-title{color:#333}
.window-menu{font-size:calc(.85rem * var(--ui-scale));color:#888;cursor:pointer;padding:2px 6px;border-radius:4px}
.window-menu:hover{background:rgba(255,255,255,.08);color:#ccc}
.window-body{flex:1;overflow:auto;position:relative;background:transparent}
.window-body::-webkit-scrollbar{width:8px;height:8px}
.window-body::-webkit-scrollbar-thumb{background:#2a2a35;border-radius:4px}
.resize-handle{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:10;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.18) 60%,transparent 60%,transparent 70%,rgba(255,255,255,.18) 70%,rgba(255,255,255,.18) 80%,transparent 80%);border-bottom-right-radius:10px;touch-action:none}
.window.fullscreen .resize-handle{display:none}

/* TERMINAL */
.terminal{background:rgba(6,6,10,.96);color:#c8c8c8;font-family:'Menlo','Courier New',monospace;padding:14px;height:100%;overflow-y:auto;font-size:calc(.76rem * var(--ui-scale));line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.term-input{background:transparent;border:none;color:#c8c8c8;font-family:inherit;font-size:inherit;outline:none;width:70%;caret-color:#c8c8c8}
.term-user{color:var(--accent)}.term-host{color:var(--accent-2)}.term-path{color:#4a7c59}.term-err{color:#ff5f57}.term-ok{color:#4a7c59}

/* SETTINGS */
.settings-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.settings-section:last-child{border-bottom:none;margin-bottom:0}
.settings-label{font-size:calc(.66rem * var(--ui-scale));color:#777;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
body.light .settings-label{color:#666}
.settings-btn{background:rgba(255,255,255,.06);color:#ddd;border:1px solid var(--border);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:calc(.76rem * var(--ui-scale));transition:background .15s ease,transform .1s ease}
.settings-btn:hover{background:rgba(255,255,255,.12)}
.settings-btn.danger{background:rgba(200,60,60,.2);border-color:rgba(200,60,60,.3)}
.settings-btn.danger:hover{background:rgba(200,60,60,.35)}
body.light .settings-btn{background:rgba(0,0,0,.04);color:#333;border-color:rgba(0,0,0,.08)}
.switch{position:relative;display:inline-block;width:42px;height:22px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#333;transition:.25s;border-radius:22px}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#ccc;transition:.25s cubic-bezier(.4,0,.2,1);border-radius:50%}
input:checked + .slider{background:#4a7c59}
input:checked + .slider:before{transform:translateX(20px)}
.settings-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.settings-row input[type=range]{flex:1;accent-color:var(--accent)}
.settings-row input[type=color]{width:44px;height:28px;border:none;background:transparent;cursor:pointer}
.settings-row input[type=text]{flex:1;padding:8px 12px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;color:inherit;font-size:calc(.76rem * var(--ui-scale));outline:none;font-family:'Menlo',monospace}
body.light .settings-row input[type=text]{background:rgba(255,255,255,.7)}

/* GITHUB */
.gh-container{padding:0;height:100%;overflow-y:auto;background:#0d1117;color:#c9d1d9;font-size:calc(.78rem * var(--ui-scale))}
.gh-topbar{padding:10px 16px;background:#010409;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:10px}
.gh-topbar .url{flex:1;background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:5px 10px;color:#8b949e;font-size:calc(.72rem * var(--ui-scale));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-topbar .gh-btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:calc(.72rem * var(--ui-scale))}
.gh-content{padding:20px 24px}
.gh-repo-title{font-size:calc(1rem * var(--ui-scale));margin-bottom:12px}
.gh-repo-title .owner,.gh-repo-title .name{color:#58a6ff}
.gh-readme{margin-top:20px;padding:16px;border:1px solid #21262d;border-radius:6px;background:#0d1117}
.gh-readme h2{font-size:calc(.95rem * var(--ui-scale));margin-bottom:8px;border-bottom:1px solid #21262d;padding-bottom:6px}

/* CONTEXT MENU */
#contextMenu{position:absolute;background:rgba(18,18,28,.97);backdrop-filter:blur(22px);border:1px solid var(--border);border-radius:10px;padding:6px;display:none;z-index:2000;min-width:200px;box-shadow:0 14px 40px rgba(0,0,0,.7);opacity:0;transform:scale(.96);transition:opacity .12s ease,transform .12s cubic-bezier(.34,1.4,.64,1)}
#contextMenu.open{display:block;opacity:1;transform:scale(1)}
.ctx-item{padding:9px 14px;border-radius:6px;cursor:pointer;font-size:calc(.76rem * var(--ui-scale));color:#ddd;transition:background .12s}
.ctx-item:hover{background:rgba(255,255,255,.09)}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}

/* NOTEPAD */
.notepad-textarea{width:100%;height:100%;background:rgba(12,12,18,.7);color:#ddd;border:none;outline:none;resize:none;padding:14px;font-family:'Courier New',monospace;font-size:calc(.8rem * var(--ui-scale));line-height:1.5}
body.light .notepad-textarea{background:rgba(255,255,255,.5);color:#222}

/* CALCULATOR */
.calc-wrap{display:flex;flex-direction:column;height:100%;padding:12px;gap:8px;background:#0e0e16}
.calc-history{flex:1;overflow-y:auto;background:rgba(0,0,0,.35);border-radius:8px;padding:10px 14px;font-family:'Menlo','Courier New',monospace;font-size:calc(.76rem * var(--ui-scale));color:#888;min-height:60px;max-height:120px}
.calc-history .row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.calc-history .row .in{color:#aaa}.calc-history .row .out{color:var(--accent);font-weight:600}
.calc-display-box{background:rgba(0,0,0,.5);border-radius:8px;padding:14px 16px;text-align:right}
.calc-display{font-size:calc(1.4rem * var(--ui-scale));font-weight:300;color:#fff;letter-spacing:.5px;word-wrap:break-word;min-height:1.6em;font-family:'Menlo','Courier New',monospace}
.calc-preview{font-size:calc(.8rem * var(--ui-scale));color:var(--accent);min-height:1.2em;font-family:'Menlo','Courier New',monospace}
.calc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.calc-grid button{padding:12px 0;background:rgba(255,255,255,.06);color:#ddd;border:1px solid rgba(255,255,255,.05);border-radius:8px;cursor:pointer;font-size:calc(.9rem * var(--ui-scale));font-family:'Menlo','Courier New',monospace;transition:background .12s ease,transform .08s ease}
.calc-grid button:hover{background:rgba(255,255,255,.12)}
.calc-grid button.op{color:var(--accent)}
.calc-grid button.fn{color:#ff9d5c;font-size:calc(.8rem * var(--ui-scale))}
.calc-grid button.eq{background:linear-gradient(135deg,#4a7c59,#3a6c49);color:#fff;grid-row:span 2}
.calc-help{padding:6px 10px;font-size:calc(.65rem * var(--ui-scale));color:#666;font-family:'Menlo',monospace;text-align:center}

/* ============ DREADDREADGO BROWSER ============ */
.browser{display:flex;flex-direction:column;height:100%;background:#f7f7f7;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.browser-tabs{display:flex;align-items:center;padding:6px 8px 0;gap:4px;background:#dee1e3;height:calc(38px * var(--ui-scale));flex-shrink:0}
.browser-tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(7px * var(--ui-scale)) calc(14px * var(--ui-scale));background:#f7f7f7;border-radius:8px 8px 0 0;font-size:calc(.72rem * var(--ui-scale));color:#333;max-width:220px}
.browser-tab .fav{width:calc(12px * var(--ui-scale));height:calc(12px * var(--ui-scale));border-radius:50%;background:linear-gradient(135deg,#de5833,#a04bd4);flex-shrink:0}
.browser-tab .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.browser-newtab{width:calc(28px * var(--ui-scale));height:calc(28px * var(--ui-scale));border-radius:50%;background:transparent;border:none;color:#555;font-size:calc(1rem * var(--ui-scale));cursor:pointer;margin-left:6px}
.browser-newtab:hover{background:rgba(0,0,0,.06)}
.browser-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#f7f7f7;height:calc(44px * var(--ui-scale));flex-shrink:0;border-bottom:1px solid #e0e0e0}
.browser-btn{width:calc(32px * var(--ui-scale));height:calc(32px * var(--ui-scale));border-radius:50%;border:none;background:transparent;color:#444;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:calc(.9rem * var(--ui-scale))}
.browser-btn:hover:not(:disabled){background:rgba(0,0,0,.07)}
.browser-btn:disabled{opacity:.35;cursor:default}
.browser-omnibox{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e0e0e0;border-radius:20px;padding:6px 14px;height:calc(34px * var(--ui-scale));transition:border-color .15s}
.browser-omnibox:focus-within{border-color:#de5833}
.browser-omnibox .lock{color:#888;font-size:calc(.75rem * var(--ui-scale))}
.browser-omnibox input{flex:1;background:transparent;border:none;outline:none;color:#333;font-size:calc(.82rem * var(--ui-scale))}
.browser-omnibox input::placeholder{color:#999}
.browser-warn{background:#fff3e0;border-bottom:1px solid #ffe0b2;padding:8px 16px;font-size:calc(.7rem * var(--ui-scale));color:#8a4a00;display:flex;align-items:center;gap:8px;flex-shrink:0}
.browser-warn b{color:#5a2a00}
.browser-content{flex:1;background:#fff;position:relative;overflow:hidden}
.browser-iframe{width:100%;height:100%;border:none;background:#fff;display:block}

/* DreadDreadGo home */
.ddg-home{padding:calc(30px * var(--ui-scale)) calc(40px * var(--ui-scale));overflow-y:auto;height:100%;background:#fff;color:#333}
.ddg-logo{text-align:center;margin-bottom:calc(30px * var(--ui-scale))}
.ddg-logo .wordmark{position:relative;display:inline-block;font-size:calc(3rem * var(--ui-scale));font-weight:800;letter-spacing:-2px;color:#de5833;font-family:'Segoe UI',Arial,sans-serif;line-height:1;padding:6px 10px}
.ddg-logo .wordmark .sticker{position:absolute;top:-10px;right:-28px;background:#ffeb3b;color:#333;font-size:calc(.72rem * var(--ui-scale));font-weight:700;padding:4px 10px;border-radius:20px;transform:rotate(8deg);box-shadow:0 2px 6px rgba(0,0,0,.15);letter-spacing:0;font-family:'Comic Sans MS','Chalkboard SE',cursive}
.ddg-logo .tagline{font-size:calc(.78rem * var(--ui-scale));color:#888;margin-top:6px}
.ddg-section{margin-bottom:calc(22px * var(--ui-scale))}
.ddg-section h3{font-size:calc(.72rem * var(--ui-scale));text-transform:uppercase;letter-spacing:1.2px;color:#de5833;margin-bottom:10px;font-weight:700}
.ddg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ddg-link{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px 14px;cursor:pointer;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px;transition:all .15s;overflow:hidden}
.ddg-link:hover{background:#fff8f5;border-color:#de5833;transform:translateY(-2px);box-shadow:0 4px 14px rgba(222,88,51,.12)}
.ddg-link .name{font-size:calc(.78rem * var(--ui-scale));color:#333;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddg-link .host{font-size:calc(.65rem * var(--ui-scale));color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddg-link .tag{font-size:calc(.58rem * var(--ui-scale));color:#de5833;text-transform:uppercase;letter-spacing:.8px;margin-top:2px;font-weight:700}

/* GAME MENU */
.game-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:18px;background:#0e0e16;height:100%;overflow-y:auto}
.game-menu h2{grid-column:1/-1;font-size:calc(.9rem * var(--ui-scale));color:#ddd;margin-bottom:4px}
.game-menu p{grid-column:1/-1;font-size:calc(.72rem * var(--ui-scale));color:#888;margin-bottom:14px}
.game-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 14px;cursor:pointer;transition:all .18s ease;display:flex;flex-direction:column;gap:6px;text-align:left}
.game-card:hover{background:rgba(122,184,255,.1);border-color:rgba(122,184,255,.4);transform:translateY(-2px)}
.game-card .ico{font-size:calc(1.6rem * var(--ui-scale));color:var(--accent)}
.game-card .name{font-size:calc(.82rem * var(--ui-scale));color:#e8e8e8;font-weight:500}
.game-card .desc{font-size:calc(.68rem * var(--ui-scale));color:#888;line-height:1.4}

.game-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a12;color:#ddd;padding:12px;gap:10px;position:relative}
.game-hud{display:flex;gap:16px;font-size:calc(.75rem * var(--ui-scale));color:#999;font-family:'Menlo','Courier New',monospace}
.game-hud b{color:var(--accent);font-weight:600}
.game-canvas{background:#050510;border:1px solid #2a2a35;border-radius:6px;display:block;max-width:100%}
.game-btn{background:rgba(255,255,255,.06);color:#ddd;border:1px solid rgba(255,255,255,.1);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:calc(.8rem * var(--ui-scale));transition:background .15s}
.game-btn:hover{background:rgba(255,255,255,.14)}
.game-help{font-size:calc(.7rem * var(--ui-scale));color:#666;text-align:center;font-family:'Menlo',monospace}
.game-back{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.5);color:#ddd;border:1px solid rgba(255,255,255,.1);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:calc(.7rem * var(--ui-scale));z-index:5}
.game-back:hover{background:rgba(0,0,0,.7)}
.memory-grid{display:grid;grid-template-columns:repeat(4,calc(64px * var(--ui-scale)));gap:8px}
.mem-card{width:calc(64px * var(--ui-scale));height:calc(64px * var(--ui-scale));background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:calc(1.6rem * var(--ui-scale));transition:background .15s;color:transparent}
.mem-card.flipped{background:rgba(74,124,89,.25);color:#fff;border-color:rgba(74,124,89,.6)}
.mem-card.matched{background:rgba(122,184,255,.15);color:#fff;border-color:rgba(122,184,255,.5);cursor:default}
.ttt-grid{display:grid;grid-template-columns:repeat(3,calc(80px * var(--ui-scale)));grid-template-rows:repeat(3,calc(80px * var(--ui-scale)));gap:6px}
.ttt-cell{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:calc(2.2rem * var(--ui-scale));font-weight:300;color:var(--accent);transition:background .15s}
.ttt-cell:hover:empty{background:rgba(255,255,255,.1)}
.ttt-cell.x{color:var(--accent)}.ttt-cell.o{color:#ff9d5c}

/* SCHOOL APPS */
.school-wrap{padding:20px;display:flex;flex-direction:column;gap:14px;height:100%;overflow-y:auto;background:#0e0e16;color:#ddd}
.school-wrap h2{font-size:calc(1rem * var(--ui-scale));font-weight:500;color:#e8e8e8}
.school-wrap p{font-size:calc(.75rem * var(--ui-scale));color:#888;line-height:1.5}
.school-wrap label{font-size:calc(.72rem * var(--ui-scale));color:#aaa;display:block;margin-bottom:4px;margin-top:8px}
.school-wrap input,.school-wrap select,.school-wrap textarea{width:100%;padding:8px 12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:6px;color:#eee;font-size:calc(.78rem * var(--ui-scale));outline:none;font-family:inherit}
.school-wrap input:focus,.school-wrap select:focus{border-color:var(--accent)}
.school-wrap button{background:var(--accent);color:#0a0a12;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:calc(.78rem * var(--ui-scale));font-weight:600;transition:background .15s}
.school-wrap button:hover{filter:brightness(1.1)}
.school-wrap .result{margin-top:10px;padding:12px;background:rgba(122,184,255,.1);border-radius:8px;font-size:calc(.8rem * var(--ui-scale));color:#ddd;line-height:1.6}
.school-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* MATRIX */
.matrix-canvas{width:100%;height:100%;display:block;background:#000}
</style>
</head>
<body>

<div id="boot">
    <div class="boot-logo">dreadOS</div>
    <div class="boot-sub">VERSION 1.0</div>
    <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
    <div class="boot-status" id="bootStatus">initializing...</div>
</div>

<div id="desktop"></div>

<div id="topbar">
    <span class="brand">dreadOS</span>
    <span class="spacer"></span>
    <div class="tray">
        <span class="chip" id="trayBattery">100%</span>
        <span class="chip" id="trayWifi">wifi</span>
        <span id="trayDate"></span>
        <span id="trayClock">--:--</span>
    </div>
</div>

<div id="dock">
    <div class="dock-icon" data-app="terminal" data-label="Terminal" onclick="openApp('terminal')">▣<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="browser" data-label="Browser" onclick="openApp('browser')">◐<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="settings" data-label="Settings" onclick="openApp('settings')">⚙<span class="dock-indicator"></span></div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-app="games" data-label="Games" onclick="openApp('games')">▶<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="school" data-label="School" onclick="openApp('school')">✎<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="github" data-label="GitHub" onclick="openApp('github')">◉<span class="dock-indicator"></span></div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-app="notepad" data-label="Notepad" onclick="openApp('notepad')">✐<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="calculator" data-label="Calculator" onclick="openApp('calculator')">±<span class="dock-indicator"></span></div>
</div>

<div id="contextMenu">
    <div class="ctx-item" onclick="openApp('terminal')">Open Terminal</div>
    <div class="ctx-item" onclick="openApp('browser')">Open Browser</div>
    <div class="ctx-item" onclick="openApp('games')">Open Games</div>
    <div class="ctx-item" onclick="openApp('school')">Open School Apps</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="openApp('settings')">Settings</div>
    <div class="ctx-item" onclick="closeAllWindows()">Close All Windows</div>
</div>

<script>
/* ============ SETTINGS ============ */
const SETTINGS = {
    theme: localStorage.getItem('dos_theme') || 'dark',
    accent: localStorage.getItem('dos_accent') || '#7ab8ff',
    accent2: localStorage.getItem('dos_accent2') || '#a04bd4',
    dockScale: parseFloat(localStorage.getItem('dos_dockscale') || '1'),
    blur: parseInt(localStorage.getItem('dos_blur') || '22'),
    anim: localStorage.getItem('dos_anim') !== 'off',
    uiScale: parseFloat(localStorage.getItem('dos_uiscale') || '0.75')
};
function applySettings(){
    document.documentElement.style.setProperty('--accent', SETTINGS.accent);
    document.documentElement.style.setProperty('--accent-2', SETTINGS.accent2);
    document.documentElement.style.setProperty('--dock-scale', SETTINGS.dockScale);
    document.documentElement.style.setProperty('--blur', SETTINGS.blur + 'px');
    document.documentElement.style.setProperty('--ui-scale', SETTINGS.uiScale);
    document.body.classList.toggle('light', SETTINGS.theme === 'light');
    desktop.classList.toggle('no-anim', !SETTINGS.anim);
}

/* ============ BOOT ============ */
const bootSteps=[[12,"loading kernel modules..."],[28,"initializing display server..."],[46,"mounting virtual filesystem..."],[64,"starting window manager..."],[80,"loading user profile..."],[94,"applying wallpaper..."],[100,"welcome, dread."]];
let bi=0;
(function runBoot(){
    if(bi>=bootSteps.length){
        setTimeout(()=>{document.getElementById('boot').classList.add('hidden');setTimeout(()=>openApp('terminal'),400);},500);
        return;
    }
    const [p,m]=bootSteps[bi++];
    document.getElementById('bootFill').style.width=p+'%';
    document.getElementById('bootStatus').textContent=m;
    setTimeout(runBoot,340);
})();

/* ============ DESKTOP ============ */
const desktop=document.getElementById('desktop');
const savedBg=localStorage.getItem('dreados_bg');
const wallUrl=localStorage.getItem('dos_wall_url');
if(savedBg){desktop.classList.add('wallpaper');desktop.style.backgroundImage=`url(${savedBg})`;}
else if(wallUrl){desktop.classList.add('wallpaper');desktop.style.backgroundImage=`url(${wallUrl})`;}
applySettings();

/* CLOCK */
function updateClock(){const d=new Date();
    document.getElementById('trayClock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    document.getElementById('trayDate').textContent=d.toLocaleDateString([],{month:'short',day:'numeric'});}
setInterval(updateClock,1000);updateClock();
if(navigator.getBattery){navigator.getBattery().then(b=>{const u=()=>document.getElementById('trayBattery').textContent=Math.round(b.level*100)+'%';u();b.addEventListener('levelchange',u);});}
else{document.getElementById('trayBattery').style.display='none';}
document.getElementById('trayWifi').textContent=navigator.onLine?'wifi':'offline';

/* ============ WINDOW MANAGER ============ */
let zTop=100;
const windows={};
const minimized={};

function createWindow(id,title,w,h,bodyHTML,appName){
    if(windows[id]){
        if(minimized[id]){const el=windows[id].el;el.style.visibility='';el.classList.remove('minimizing');minimized[id]=false;}
        focusWin(id);return;
    }
    const win=document.createElement('div');
    win.className='window';win.id='win-'+id;
    const off=Object.keys(windows).length*28;
    win.style.left=(Math.max(30,(window.innerWidth-w)/2+off-70))+'px';
    win.style.top=(Math.max(40,(window.innerHeight-h)/2+off-50))+'px';
    win.style.width=w+'px';win.style.height=h+'px';
    win.style.zIndex=++zTop;
    win.innerHTML=`
        <div class="window-header">
            <div class="window-dots">
                <div class="dot red"    onclick="event.stopPropagation();closeWin('${id}')"></div>
                <div class="dot yellow" onclick="event.stopPropagation();minimizeWin('${id}')"></div>
                <div class="dot green"  onclick="event.stopPropagation();toggleFullscreen('${id}')"></div>
            </div>
            <div class="window-title">${title}</div>
            <div class="window-menu" onclick="event.stopPropagation();">⋯</div>
        </div>
        <div class="window-body" id="body-${id}">${bodyHTML}</div>
        <div class="resize-handle" data-win="${id}"></div>`;
    document.body.appendChild(win);
    requestAnimationFrame(()=>win.classList.add('open'));

    const header=win.querySelector('.window-header');
    let drag=false, sx=0, sy=0, sl=0, st=0, pid=null;
    header.addEventListener('pointerdown', e=>{
        if(e.target.classList.contains('dot')||e.target.classList.contains('window-menu'))return;
        if(win.classList.contains('fullscreen'))return;
        drag=true; pid=e.pointerId;
        sx=e.clientX; sy=e.clientY;
        sl=win.offsetLeft; st=win.offsetTop;
        win.classList.add('dragging');
        header.setPointerCapture(pid);
        focusWin(id);
        e.preventDefault();
    });
    header.addEventListener('pointermove', e=>{
        if(!drag||e.pointerId!==pid)return;
        win.style.left=(sl+e.clientX-sx)+'px';
        win.style.top =(st+e.clientY-sy)+'px';
    });
    function endDrag(){
        if(!drag)return;
        drag=false;
        try{header.releasePointerCapture(pid);}catch(_){}
        pid=null;
        win.classList.remove('dragging');
    }
    header.addEventListener('pointerup', endDrag);
    header.addEventListener('pointercancel', endDrag);

    const rH=win.querySelector('.resize-handle');
    let resizing=false, rx=0, ry=0, rw=0, rh=0, rpid=null;
    rH.addEventListener('pointerdown', e=>{
        if(win.classList.contains('fullscreen'))return;
        resizing=true; rpid=e.pointerId;
        rx=e.clientX; ry=e.clientY;
        rw=win.offsetWidth; rh=win.offsetHeight;
        win.classList.add('resizing');
        rH.setPointerCapture(rpid);
        focusWin(id);
        e.preventDefault();
        e.stopPropagation();
    });
    rH.addEventListener('pointermove', e=>{
        if(!resizing||e.pointerId!==rpid)return;
        const newW=Math.max(280, rw + (e.clientX - rx));
        const newH=Math.max(180, rh + (e.clientY - ry));
        win.style.width=newW+'px';
        win.style.height=newH+'px';
    });
    function endResize(){
        if(!resizing)return;
        resizing=false;
        try{rH.releasePointerCapture(rpid);}catch(_){}
        rpid=null;
        win.classList.remove('resizing');
    }
    rH.addEventListener('pointerup', endResize);
    rH.addEventListener('pointercancel', endResize);

    win.addEventListener('mousedown',()=>focusWin(id));
    windows[id]={el:win,app:appName||id};
    updateDockIndicators();updateWinCount();
    return win;
}
function focusWin(id){const w=windows[id];if(!w)return;
    if(minimized[id]){w.el.style.visibility='';w.el.classList.remove('minimizing');minimized[id]=false;}
    w.el.style.zIndex=++zTop;updateDockIndicators();}
function closeWin(id){const w=windows[id];if(!w)return;
    w.el.classList.add('closing');
    ['snake','pong','breakout','matrix','pipes','dodge','game2048','simon','whack'].forEach(g=>{
        if(id===g&&window['_'+g+'Int'])clearInterval(window['_'+g+'Int']);
    });
    setTimeout(()=>{w.el.remove();delete windows[id];delete minimized[id];updateDockIndicators();updateWinCount();},220);
    updateWinCount();}
function minimizeWin(id){const w=windows[id];if(!w)return;
    w.el.classList.add('minimizing');minimized[id]=true;
    setTimeout(()=>{if(windows[id])w.el.style.visibility='hidden';},340);}
function toggleFullscreen(id){const w=windows[id];if(!w)return;
    const isFull=w.el.classList.contains('fullscreen');
    if(isFull){w.el.classList.remove('fullscreen');
        if(w.el.dataset.prev){const p=JSON.parse(w.el.dataset.prev);
            w.el.style.left=p.left;w.el.style.top=p.top;w.el.style.width=p.width;w.el.style.height=p.height;}}
    else{w.el.dataset.prev=JSON.stringify({left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height});
        w.el.classList.add('fullscreen');}
    focusWin(id);}
function closeAllWindows(){Object.keys(windows).forEach(closeWin);}
function updateDockIndicators(){document.querySelectorAll('.dock-icon').forEach(ic=>{
    const app=ic.dataset.app;
    const hasOpen=Object.values(windows).some(w=>w.app===app);
    ic.classList.toggle('has-window',hasOpen);});}
function updateWinCount(){const el=document.getElementById('winCount');if(el)el.textContent=Object.keys(windows).length;}

/* ============ APP LAUNCHER ============ */
function openApp(name){
    const map={
        terminal:openTerminal, browser:openBrowser, settings:openSettings,
        notepad:openNotepad, calculator:openCalculator, github:openGithub,
        games:openGameMenu, school:openSchool,
        snake:startSnake, tictactoe:startTicTacToe, pong:startPong,
        memory:startMemory, breakout:startBreakout, dodge:startDodge,
        twhg:startTWHG, doom:openDoom, game2048:start2048,
        simon:startSimon, whack:startWhack
    };
    if(map[name])map[name]();
}

/* ============ TERMINAL ============ */
function openTerminal(){
    const html=`
        <div class="terminal" id="termOut">
<span style="color:#666">Welcome to dreadOS 1.0 — type "help" for commands.</span>
<span id="termPrompt"><span class="term-user">dread</span><span style="color:#666">@</span><span class="term-host">dreados</span><span class="term-path">:~$</span></span> <input class="term-input" id="termIn" autocomplete="off" spellcheck="false">
        </div>`;
    createWindow('terminal','Terminal',720,460,html,'terminal');
    setTimeout(()=>{
        const inp=document.getElementById('termIn');
        if(!inp)return;
        inp.focus();
        inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=inp.value.trim();inp.value='';handleCmd(c);}});
        document.getElementById('termOut').addEventListener('click',()=>inp.focus());
        setTimeout(()=>printSpecs(),500);
    },80);
}
function printTerm(html){
    const out=document.getElementById('termOut');
    const prompt=document.getElementById('termPrompt');
    if(!out||!prompt)return;
    const line=document.createElement('div');line.innerHTML=html;
    out.insertBefore(line,prompt);out.scrollTop=out.scrollHeight;
}
function handleCmd(cmd){
    printTerm(`<span class="term-user">dread</span><span style="color:#666">@</span><span class="term-host">dreados</span><span class="term-path">:~$</span> ${cmd}`);
    const c=cmd.toLowerCase().trim();
    const parts=c.split(/\s+/);
    const base=parts[0];

    if(base==='help'){
        printTerm('<span class="term-ok">General:</span>');
        printTerm('  help / clear / date / whoami / uname / pwd / ls / cd / cat / tree / history / man');
        printTerm('  echo [text] / cowsay [text] / fortune');
        printTerm('<span class="term-ok">Fun:</span>');
        printTerm('  neofetch / specs / sl / matrix / pipes.sh');
        printTerm('<span class="term-ok">Apps:</span>');
        printTerm('  open browser | settings | games | school | notepad');
        printTerm('<span class="term-ok">Games:</span>');
        printTerm('  play snake | tictactoe | pong | memory | breakout | dodge | twhg | doom | 2048 | simon | whack');
    }
    else if(base==='clear'){
        const out=document.getElementById('termOut');if(!out)return;
        out.innerHTML=`<span id="termPrompt"><span class="term-user">dread</span><span style="color:#666">@</span><span class="term-host">dreados</span><span class="term-path">:~$</span></span> <input class="term-input" id="termIn" autocomplete="off" spellcheck="false">`;
        const inp=document.getElementById('termIn');
        if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter'){handleCmd(inp.value.trim());inp.value='';}});}
    }
    else if(base==='specs'||base==='neofetch'){printSpecs();}
    else if(base==='date'){printTerm(new Date().toString());}
    else if(base==='whoami'){printTerm('dread');}
    else if(base==='uname'){printTerm(parts[1]==='-a'?'dreadOS 1.0 dreados x86_64 browser/JS':'dreadOS');}
    else if(base==='pwd'){printTerm('/home/dread');}
    else if(base==='ls'){printTerm('<span style="color:#7ab8ff">Documents/</span>  <span style="color:#7ab8ff">Downloads/</span>  <span style="color:#7ab8ff">Pictures/</span><br><span style="color:#a04bd4">.bashrc</span>  <span style="color:#a04bd4">notes.txt</span>  <span style="color:#a04bd4">README.md</span>');}
    else if(base==='cd'||base==='cat'){printTerm('(fake shell — no real filesystem)');}
    else if(base==='tree'){
        printTerm('/home/dread');
        printTerm('├── Documents/');
        printTerm('│   ├── <span style="color:#a04bd4">homework.txt</span>');
        printTerm('│   └── <span style="color:#a04bd4">notes.md</span>');
        printTerm('├── Downloads/');
        printTerm('├── Pictures/');
        printTerm('└── <span style="color:#a04bd4">README.md</span>');
    }
    else if(base==='history'){printTerm('(history not saved in this session)');}
    else if(base==='man'){printTerm(parts[1]?`No manual entry for ${parts[1]}. Try "help".`:'What manual page do you want?');}
    else if(base==='echo'){printTerm(cmd.substring(5));}
    else if(base==='cowsay'){
        const msg=cmd.substring(7)||'moo';
        printTerm(' '+'_'.repeat(msg.length+2));
        printTerm('< '+msg+' >');
        printTerm(' '+'-'.repeat(msg.length+2));
        printTerm('        \\   ^__^');
        printTerm('         \\  (oo)\\_______');
        printTerm('            (__)\\       )\\/\\');
        printTerm('                ||----w |');
        printTerm('                ||     ||');
    }
    else if(base==='fortune'){
        const f=['The best way to predict the future is to invent it.','Simplicity is the ultimate sophistication.','Talk is cheap. Show me the code.','Deleted code is debugged code.','It works on my machine.','There are only two hard things in CS: cache invalidation, naming things, and off-by-one errors.'];
        printTerm(f[Math.floor(Math.random()*f.length)]);
    }
    else if(base==='sl'){
        printTerm('      ====        ________                ___________ ');
        printTerm('  _D _|  |_______/        \\__I_I_____===__|_________| ');
        printTerm('   |(_)---  |   H\\________/ |   |        =|___ ___|   ');
        printTerm('   /     |  |   H  |  |     |   |         ||_| |_||   ');
        printTerm('  |      |  |   H  |__--------------------| [___] |   ');
        printTerm('  | ________|___H__/__|_____/[][]~\\_______|       |   ');
        printTerm('  |/ |   |-----------I_____I [][] []  D   |=======|__ ');
        printTerm('__/ =| o |=-~~\\  /~~\\  /~~\\  /~~\\ ____Y___________|__ ');
        printTerm(' |/-=|___|=    ||    ||    ||    |_____/~\\___/        ');
        printTerm('  \\_/      \\O=====O=====O=====O_/      \\_/            ');
    }
    else if(base==='matrix'){openMatrix();}
    else if(base==='pipes.sh'||base==='pipes'){openPipes();}
    else if(c==='open browser'){openBrowser();printTerm('<span class="term-ok">launching browser...</span>');}
    else if(c==='open settings'){openSettings();printTerm('<span class="term-ok">launching settings...</span>');}
    else if(c==='open notepad'){openNotepad();printTerm('<span class="term-ok">launching notepad...</span>');}
    else if(c==='open games'){openGameMenu();printTerm('<span class="term-ok">launching games...</span>');}
    else if(c==='open school'){openSchool();printTerm('<span class="term-ok">launching school apps...</span>');}
    else if(base==='play'){
        const g=parts[1];
        const map={snake:startSnake,tictactoe:startTicTacToe,pong:startPong,memory:startMemory,breakout:startBreakout,dodge:startDodge,twhg:startTWHG,doom:openDoom,2048:start2048,simon:startSimon,whack:startWhack};
        if(map[g]){map[g]();printTerm(`<span class="term-ok">launching ${g}...</span>`);}
        else printTerm(`<span class="term-err">unknown game: ${g||'(none)'}</span>`);
    }
    else if(cmd===''){}
    else{printTerm(`<span class="term-err">unknown command: ${cmd}</span> — type "help"`);}
}

function printSpecs(){
    const gl=document.createElement('canvas').getContext('webgl');
    const dbg=gl.getExtension('WEBGL_debug_renderer_info');
    const gpu=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'unknown';
    const LOGO=[
        '<span style="color:#7ab8ff">  ██████╗ </span>',
        '<span style="color:#7ab8ff">  ██╔══██╗</span>',
        '<span style="color:#7ab8ff">  ██║  ██║</span>',
        '<span style="color:#7ab8ff">  ██║  ██║</span>',

function openMatrix(){
    const html=`<canvas id="matrixCanvas" class="matrix-canvas"></canvas>`;
    createWindow('matrix','matrix',720,480,html,'terminal');
    setTimeout(()=>{
        const c=document.getElementById('matrixCanvas');if(!c)return;
        c.width=c.clientWidth;c.height=c.clientHeight;
        const ctx=c.getContext('2d');
        const cols=Math.floor(c.width/14);
        const drops=Array(cols).fill(1);
        const chars='アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEF';
        function draw(){
            ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle='#0f0';ctx.font='14px monospace';
            for(let i=0;i<drops.length;i++){
                ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*14,drops[i]*14);
                if(drops[i]*14>c.height&&Math.random()>0.975)drops[i]=0;
                drops[i]++;
            }
        }
        clearInterval(window._matrixInt);
        window._matrixInt=setInterval(draw,50);
        const stop=()=>{clearInterval(window._matrixInt);document.removeEventListener('keydown',stop);};
        document.addEventListener('keydown',stop);
    },80);
}
function openPipes(){
    const html=`<canvas id="pipesCanvas" class="matrix-canvas"></canvas>`;
    createWindow('pipes','pipes.sh',720,480,html,'terminal');
    setTimeout(()=>{
        const c=document.getElementById('pipesCanvas');if(!c)return;
        c.width=c.clientWidth;c.height=c.clientHeight;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
        const pipeChars='│─┌┐└┘├┤┬┴┼';
        const colors=['#7ab8ff','#a04bd4','#4a7c59','#febc2e','#ff5f57'];
        let pipes=[];
        for(let i=0;i<8;i++){
            pipes.push({x:Math.floor(Math.random()*c.width/16)*16,y:Math.floor(Math.random()*c.height/16)*16,dx:[1,-1,0,0][Math.floor(Math.random()*4)],dy:[0,0,1,-1][Math.floor(Math.random()*4)],color:colors[Math.floor(Math.random()*colors.length)]});
        }
        function draw(){
            ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);
            ctx.font='16px monospace';
            pipes.forEach(p=>{
                ctx.fillStyle=p.color;
                ctx.fillText(pipeChars[Math.floor(Math.random()*pipeChars.length)],p.x,p.y);
                p.x+=p.dx*16;p.y+=p.dy*16;
                if(Math.random()<0.15){const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>!(d[0]===-p.dx&&d[1]===-p.dy));const n=opts[Math.floor(Math.random()*opts.length)];p.dx=n[0];p.dy=n[1];}
                if(p.x<0||p.x>c.width||p.y<0||p.y>c.height){p.x=Math.floor(Math.random()*c.width/16)*16;p.y=Math.floor(Math.random()*c.height/16)*16;}
            });
        }
        clearInterval(window._pipesInt);
        window._pipesInt=setInterval(draw,80);
        const stop=()=>{clearInterval(window._pipesInt);document.removeEventListener('keydown',stop);};
        document.addEventListener('keydown',stop);
    },80);
}

/* ============ DODGE ============ */
function startDodge(){
    const html=`
        <div class="game-wrap">
            <button class="game-back" onclick="closeWin('dodge');openGameMenu()">← Back</button>
            <div class="game-hud">DEATHS <b id="dodgeDeaths">0</b> LEVEL <b id="dodgeLevel">1</b></div>
            <canvas id="dodgeCanvas" class="game-canvas" width="480" height="360"></canvas>
            <button class="game-btn" onclick="dodgeReset()">Restart</button>
            <div class="game-help">Arrow keys / WASD to move — avoid red circles, reach green zone</div>
        </div>`;
    createWindow('dodge','Dodge',520,500,html,'games');
    setTimeout(()=>dodgeInit(),50);
}
let dodge=null;
function dodgeInit(){
    const canvas=document.getElementById('dodgeCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const W=canvas.width,H=canvas.height;
    const PLAYER=10;
    const levels=[
        {start:{x:20,y:H/2}, goal:{x:W-40,y:H/2,w:20,h:60}, walls:[], enemies:[{x:W/2,y:H/2,r:8,vx:0,vy:1.2,range:H-20,dir:1}]},
        {start:{x:20,y:20}, goal:{x:W-40,y:H-60,w:20,h:60}, walls:[{x:W/2-40,y:H/2-40,w:80,h:80}], enemies:[{x:W/2,y:30,r:9,vx:0,vy:1.6,range:H-40,dir:1},{x:W/2,y:H-30,r:9,vx:0,vy:-1.6,range:H-40,dir:-1}]},
        {start:{x:20,y:H/2}, goal:{x:W-40,y:H/2,w:20,h:60}, walls:[{x:W/3,y:0,w:20,h:H/3},{x:W/3,y:H*2/3,w:20,h:H/3}], enemies:[{x:W/2,y:H/4,r:8,vx:1.8,vy:0,range:W-40,dir:1},{x:W/2,y:H*3/4,r:8,vx:-1.8,vy:0,range:W-40,dir:-1}]}
    ];
    function reset(){dodge={level:0,deaths:0,player:{x:levels[0].start.x,y:levels[0].start.y},walls:[],enemies:[]};loadLevel(0);}
    function loadLevel(i){
        dodge.level=i;
        const L=levels[i];
        dodge.player.x=L.start.x;dodge.player.y=L.start.y;
        dodge.walls=L.walls.map(w=>({...w}));
        dodge.enemies=L.enemies.map(e=>({...e, baseY:e.y, baseX:e.x, t:0}));
        const dl=document.getElementById('dodgeLevel');if(dl)dl.textContent=i+1;
        const dd=document.getElementById('dodgeDeaths');if(dd)dd.textContent=dodge.deaths;
    }
    function draw(){
        ctx.fillStyle='#0a0a18';ctx.fillRect(0,0,W,H);
        ctx.strokeStyle='#3a3a55';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);
        const L=levels[dodge.level];
        ctx.fillStyle='rgba(74,124,89,.6)';ctx.fillRect(L.goal.x,L.goal.y,L.goal.w,L.goal.h);
        ctx.strokeStyle='#4a7c59';ctx.strokeRect(L.goal.x,L.goal.y,L.goal.w,L.goal.h);
        ctx.fillStyle='#3a3a55';
        dodge.walls.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h));
        ctx.fillStyle='#ff5f57';
        dodge.enemies.forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();});
        ctx.fillStyle='#7ab8ff';
        ctx.fillRect(dodge.player.x,dodge.player.y,PLAYER,PLAYER);
    }
    function step(){
        if(!dodge)return;
        const L=levels[dodge.level];
        dodge.enemies.forEach(e=>{
            e.t+=1; e.y+=e.vy; e.x+=e.vx;
            if(e.y>e.baseY+e.range)e.vy=-Math.abs(e.vy);
            if(e.y<e.baseY-e.range)e.vy=Math.abs(e.vy);
            if(e.x>e.baseX+e.range)e.vx=-Math.abs(e.vx);
            if(e.x<e.baseX-e.range)e.vx=Math.abs(e.vx);
        });
        const p={x:dodge.player.x+PLAYER/2,y:dodge.player.y+PLAYER/2};
        for(const e of dodge.enemies){
            const dx=p.x-e.x, dy=p.y-e.y;
            if(Math.sqrt(dx*dx+dy*dy) < e.r+PLAYER/2){
                dodge.deaths++;
                const dd=document.getElementById('dodgeDeaths');if(dd)dd.textContent=dodge.deaths;
                dodge.player.x=L.start.x;dodge.player.y=L.start.y;
                return;
            }
        }
        for(const w of dodge.walls){
            if(p.x>w.x-2 && p.x<w.x+w.w+2 && p.y>w.y-2 && p.y<w.y+w.h+2){
                dodge.player.x=L.start.x;dodge.player.y=L.start.y;return;
            }
        }
        if(dodge.player.x+PLAYER>L.goal.x && dodge.player.x<L.goal.x+L.goal.w &&
           dodge.player.y+PLAYER>L.goal.y && dodge.player.y<L.goal.y+L.goal.h){
            if(dodge.level+1<levels.length){loadLevel(dodge.level+1);}
            else{
                ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
                ctx.fillStyle='#4a7c59';ctx.font='24px sans-serif';ctx.textAlign='center';
                ctx.fillText('YOU WIN!',W/2,H/2-10);
                ctx.fillStyle='#ccc';ctx.font='14px sans-serif';
                ctx.fillText('Deaths: '+dodge.deaths,W/2,H/2+20);
            }
        }
        draw();
    }
    const keys={};
    window.dodgeKey=e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();};
    window.dodgeKeyUp=e=>{keys[e.key.toLowerCase()]=false;};
    document.addEventListener('keydown',window.dodgeKey);
    document.addEventListener('keyup',window.dodgeKeyUp);
    window.dodgeReset=()=>{dodge.deaths=0;loadLevel(0);const dd=document.getElementById('dodgeDeaths');if(dd)dd.textContent=0;};
    reset();
    clearInterval(window._dodgeInt);
    window._dodgeInt=setInterval(()=>{
        if(!dodge)return;
        const spd=3;
        if(keys['arrowup']||keys['w'])dodge.player.y=Math.max(0,dodge.player.y-spd);
        if(keys['arrowdown']||keys['s'])dodge.player.y=Math.min(H-PLAYER,dodge.player.y+spd);
        if(keys['arrowleft']||keys['a'])dodge.player.x=Math.max(0,dodge.player.x-spd);
        if(keys['arrowright']||keys['d'])dodge.player.x=Math.min(W-PLAYER,dodge.player.x+spd);
        step();
    },1000/60);
}

/* ============ SNAKE ============ */
function startSnake(){
    const html=`
        <div class="game-wrap">
            <button class="game-back" onclick="closeWin('snake');openGameMenu()">← Back</button>
            <div class="game-hud">SCORE <b id="snakeScore">0</b> BEST <b id="snakeBest">${localStorage.getItem('snakeBest')||0}</b></div>
            <canvas id="snakeCanvas" class="game-canvas" width="360" height="360"></canvas>
            <button class="game-btn" onclick="snakeReset()">New Game</button>
            <div class="game-help">Arrow keys / WASD — Space to pause</div>
        </div>`;
    createWindow('snake','Snake',400,500,html,'games');
    setTimeout(()=>snakeInit(),50);
}
let snake=null;
function snakeInit(){
    const canvas=document.getElementById('snakeCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const size=18, tiles=20;
    function reset(){
        snake={x:10,y:10,dx:1,dy:0,cells:[{x:10,y:10}],food:randFood(),score:0,paused:false,dead:false};
        const s=document.getElementById('snakeScore');if(s)s.textContent=0;
    }
    function randFood(){return {x:Math.floor(Math.random()*tiles),y:Math.floor(Math.random()*tiles)};}
    function draw(){
        ctx.fillStyle='#050510';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
        for(let i=0;i<=tiles;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,tiles*size);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(tiles*size,i*size);ctx.stroke();}
        ctx.fillStyle='#ff5f57';
        ctx.beginPath();ctx.arc(snake.food.x*size+size/2,snake.food.y*size+size/2,size/2-2,0,Math.PI*2);ctx.fill();
        snake.cells.forEach((c,i)=>{ctx.fillStyle=i===0?'#7ab8ff':'#4a7c59';ctx.fillRect(c.x*size+1,c.y*size+1,size-2,size-2);});
        if(snake.paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('PAUSED',canvas.width/2,canvas.height/2);}
        if(snake.dead){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff5f57';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-10);ctx.fillStyle='#ccc';ctx.font='14px sans-serif';ctx.fillText('Score: '+snake.score,canvas.width/2,canvas.height/2+20);}
    }
    function step(){
        if(!snake||snake.paused||snake.dead)return;
        const head={x:snake.cells[0].x+snake.dx,y:snake.cells[0].y+snake.dy};
        if(head.x<0||head.x>=tiles||head.y<0||head.y>=tiles||snake.cells.some(c=>c.x===head.x&&c.y===head.y)){
            snake.dead=true;draw();
            const best=parseInt(localStorage.getItem('snakeBest')||0);
            if(snake.score>best){localStorage.setItem('snakeBest',snake.score);const b=document.getElementById('snakeBest');if(b)b.textContent=snake.score;}
            return;
        }
        snake.cells.unshift(head);
        if(head.x===snake.food.x&&head.y===snake.food.y){snake.score++;snake.food=randFood();const s=document.getElementById('snakeScore');if(s)s.textContent=snake.score;}
        else snake.cells.pop();
        draw();
    }
    window.snakeReset=()=>{reset();draw();};
    window.snakeKey=e=>{
        if(!snake)return;
        const k=e.key.toLowerCase();
        if((k==='arrowup'||k==='w')&&snake.dy!==1){snake.dx=0;snake.dy=-1;}
        else if((k==='arrowdown'||k==='s')&&snake.dy!==-1){snake.dx=0;snake.dy=1;}
        else if((k==='arrowleft'||k==='a')&&snake.dx!==1){snake.dx=-1;snake.dy=0;}
        else if((k==='arrowright'||k==='d')&&snake.dx!==-1){snake.dx=1;snake.dy=0;}
        else if(k===' '){snake.paused=!snake.paused;draw();}
        if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
    };
    document.addEventListener('keydown',window.snakeKey);
    reset();draw();
    clearInterval(window._snakeInt);
    window._snakeInt=setInterval(step,100);
}

/* ============ TIC TAC TOE ============ */
function startTicTacToe(){
    const html=`
        <div class="game-wrap">
            <button class="game-back" onclick="closeWin('tictactoe');openGameMenu()">← Back</button>
            <div class="game-hud">YOU <b>X</b> — AI <b>O</b> — <span id="tttStatus">Your turn</span></div>
            <div class="ttt-grid" id="tttGrid">${Array.from({length:9}).map((_,i)=>`<div class="ttt-cell" data-i="${i}" onclick="tttClick(${i})"></div>`).join('')}</div>
            <button class="game-btn" onclick="tttReset()">New Game</button>
        </div>`;
    createWindow('tictactoe','Tic Tac Toe',330,420,html,'games');
    setTimeout(()=>tttReset(),50);
}
let tttBoard=null, tttDone=false;
function tttReset(){
    tttBoard=['','','','','','','','',''];tttDone=false;
    document.querySelectorAll('#tttGrid .ttt-cell').forEach(c=>{c.textContent='';c.className='ttt-cell';});
    const s=document.getElementById('tttStatus');if(s)s.textContent='Your turn';
}
function tttClick(i){
    if(tttDone||tttBoard[i])return;
    tttBoard[i]='X';updateTTT();
    if(checkTTT('X'))return;
    if(tttBoard.every(c=>c))return;
    const s=document.getElementById('tttStatus');if(s)s.textContent='AI thinking...';
    setTimeout(()=>{
        const move=bestTTTMove();
        if(move!==null){tttBoard[move]='O';updateTTT();
            if(checkTTT('O'))return;
            if(tttBoard.every(c=>c)){const s=document.getElementById('tttStatus');if(s)s.textContent='Draw!';tttDone=true;return;}
        }
        const s2=document.getElementById('tttStatus');if(s2)s2.textContent='Your turn';
    },250);
}
function updateTTT(){
    document.querySelectorAll('#tttGrid .ttt-cell').forEach((c,i)=>{
        c.textContent=tttBoard[i];
        c.className='ttt-cell'+(tttBoard[i]==='X'?' x':tttBoard[i]==='O'?' o':'');
    });
}
function checkTTT(p){
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(const w of wins){if(tttBoard[w[0]]===p&&tttBoard[w[1]]===p&&tttBoard[w[2]]===p){const s=document.getElementById('tttStatus');if(s)s.textContent=p==='X'?'You win!':'AI wins!';tttDone=true;return true;}}
    return false;
}
function bestTTTMove(){
    const empty=tttBoard.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(!empty.length)return null;
    for(const p of ['O','X'])for(const i of empty){
        const copy=[...tttBoard];copy[i]=p;
        const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        if(wins.some(w=>copy[w[0]]===p&&copy[w[1]]===p&&copy[w[2]]===p))return i;
    }
    if(tttBoard[4]==='')return 4;
    const corners=[0,2,6,8].filter(i=>tttBoard[i]==='');
    if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
    return empty[Math.floor(Math.random()*empty.length)];
}

/* ============ PONG ============ */
function startPong(){
    const html=`
        <div class="game-wrap">
            <button class="game-back" onclick="closeWin('pong');openGameMenu()">← Back</button>
            <div class="game-hud">YOU <b id="pongYou">0</b> — AI <b id="pongAi">0</b></div>
            <canvas id="pongCanvas" class="game-canvas" width="480" height="320"></canvas>
            <button class="game-btn" onclick="pongReset()">New Game</button>
            <div class="game-help">Mouse or ↑/↓</div>
        </div>`;
    createWindow('pong','Pong',520,460,html,'games');
    setTimeout(()=>pongInit(),50);
}
let pong=null;
function pongInit(){
    const canvas=document.getElementById('pongCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const W=canvas.width,H=canvas.height;
    const PH=70,PW=10;
    function reset(){
        pong={player:{y:H/2-PH/2,x:20,w:PW,h:PH},ai:{y:H/2-PH/2,x:W-30,w:PW,h:PH},ball:{x:W/2,y:H/2,dx:4,dy:2,r:6},you:0,ai:0,over:false};
        const a=document.getElementById('pongYou');if(a)a.textContent=0;
        const b=document.getElementById('pongAi');if(b)b.textContent=0;
    }
    function draw(){
        ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
        ctx.strokeStyle='rgba(255,255,255,.15)';ctx.setLineDash([6,6]);
        ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#7ab8ff';ctx.fillRect(pong.player.x,pong.player.y,pong.player.w,pong.player.h);
        ctx.fillStyle='#ff5f57';ctx.fillRect(pong.ai.x,pong.ai.y,pong.ai.w,pong.ai.h);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pong.ball.x,pong.ball.y,pong.ball.r,0,Math.PI*2);ctx.fill();
        if(pong.over){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2);}
    }
    function step(){
        if(!pong||pong.over)return;
        pong.ball.x+=pong.ball.dx;pong.ball.y+=pong.ball.dy;
        if(pong.ball.y<0||pong.ball.y>H)pong.ball.dy*=-1;
        if(pong.ball.x-pong.ball.r<pong.player.x+pong.player.w&&pong.ball.y>pong.player.y&&pong.ball.y<pong.player.y+pong.player.h&&pong.ball.dx<0){pong.ball.dx*=-1;pong.ball.dx*=1.05;}
        if(pong.ball.x+pong.ball.r>pong.ai.x&&pong.ball.y>pong.ai.y&&pong.ball.y<pong.ai.y+pong.ai.h&&pong.ball.dx>0){pong.ball.dx*=-1;pong.ball.dx*=1.05;}
        if(pong.ball.x<0){pong.ai++;const a=document.getElementById('pongAi');if(a)a.textContent=pong.ai;if(pong.ai>=5)pong.over=true;else{pong.ball.x=W/2;pong.ball.y=H/2;pong.ball.dx=4;pong.ball.dy=2;}}
        if(pong.ball.x>W){pong.you++;const a=document.getElementById('pongYou');if(a)a.textContent=pong.you;if(pong.you>=5)pong.over=true;else{pong.ball.x=W/2;pong.ball.y=H/2;pong.ball.dx=-4;pong.ball.dy=-2;}}
        const target=pong.ball.y-PH/2;
        pong.ai.y+=Math.max(-4,Math.min(4,(target-pong.ai.y)*0.08));
        draw();
    }
    window.pongReset=()=>reset();
    window.pongKey=e=>{if(!pong)return;if(e.key==='ArrowUp'){pong.player.y=Math.max(0,pong.player.y-20);e.preventDefault();}if(e.key==='ArrowDown'){pong.player.y=Math.min(H-PH,pong.player.y+20);e.preventDefault();}};
    canvas.addEventListener('mousemove',e=>{if(!pong)return;const r=canvas.getBoundingClientRect();pong.player.y=Math.max(0,Math.min(H-PH,(e.clientY-r.top)-PH/2));});
    document.addEventListener('keydown',window.pongKey);
    reset();
    clearInterval(window._pongInt);
    window._pongInt=setInterval(step,1000/60);
}

function startMemory(){

        <div class="game-wrap">
            <button class="game-back" onclick="closeWin('memory');openGameMenu()">← Back</button>
            <div class="game-hud">MOVES <b id="memMoves">0</b> MATCHES <b id="memMatches">0</b>/8</div>
            <div class="memory-grid" id="memGrid"></div>
            <button class="game-btn" onclick="memReset()">New Game</button>
        </div>`;
    createWindow('memory','Memory Match',340,440,html,'games');
    setTimeout(()=>memReset(),50);
}
let memState=null;
function memReset(){
    const emojis=['🍎','🍌','🍇','🍒','🥝','🍑','🍍','🥥'];
    const deck=[...emojis,...emojis].sort(()=>Math.random()-0.5);
    memState={deck,flipped:[],matched:new Set(),moves:0,lock:false};
    const m=document.getElementById('memMoves');if(m)m.textContent=0;
    const mm=document.getElementById('memMatches');if(mm)mm.textContent=0;
    renderMem();
}
function renderMem(){
    const grid=document.getElementById('memGrid');if(!grid)return;
    grid.innerHTML=memState.deck.map((e,i)=>{
        const isFlipped=memState.flipped.includes(i)||memState.matched.has(i);
        const cls='mem-card'+(isFlipped?' flipped':'')+(memState.matched.has(i)?' matched':'');
        return `<div class="${cls}" onclick="memClick(${i})">${isFlipped?e:''}</div>`;
    }).join('');
}
function memClick(i){
    if(!memState||memState.lock)return;
    if(memState.flipped.includes(i)||memState.matched.has(i))return;
    memState.flipped.push(i);renderMem();
    if(memState.flipped.length===2){
        memState.moves++;const m=document.getElementById('memMoves');if(m)m.textContent=memState.moves;
        const [a,b]=memState.flipped;
        if(memState.deck[a]===memState.deck[b]){
            memState.matched.add(a);memState.matched.add(b);memState.flipped=[];
            const mm=document.getElementById('memMatches');if(mm)mm.textContent=memState.matched.size/2;
            renderMem();
        } else {memState.lock=true;setTimeout(()=>{memState.flipped=[];memState.lock=false;renderMem();},700);}
    }
}

function startBreakout(){
    const html=`
        <div class="game-wrap">

            <div class="game-hud">SCORE <b id="brScore">0</b> LIVES <b id="brLives">3</b></div>
            <canvas id="brCanvas" class="game-canvas" width="480" height="360"></canvas>
            <button class="game-btn" onclick="brReset()">New Game</button>
            <div class="game-help">Mouse or ←/→</div>
        </div>`;
    createWindow('breakout','Breakout',520,500,html,'games');
    setTimeout(()=>brInit(),50);

let br=null;
function brInit(){
    const canvas=document.getElementById('brCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const W=canvas.width,H=canvas.height;
    const PW=90,PH=12,BC=9;
    function reset(){
        br={paddle:{x:W/2-PW/2,w:PW,h:PH},ball:{x:W/2,y:H-40,dx:3,dy:-3,r:6},
            bricks:Array.from({length:5},(_,r)=>Array.from({length:BC},(_,c)=>({x:c*52+10,y:r*22+30,alive:true,color:['#ff5f57','#febc2e','#7ab8ff','#a04bd4','#4a7c59'][r]}))).flat(),
            score:0,lives:3,over:false};
        const s=document.getElementById('brScore');if(s)s.textContent=0;
        const l=document.getElementById('brLives');if(l)l.textContent=3;
    }
    function draw(){
        ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
        br.bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,48,16);}});
        ctx.fillStyle='#7ab8ff';ctx.fillRect(br.paddle.x,H-30,br.paddle.w,br.paddle.h);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(br.ball.x,br.ball.y,br.ball.r,0,Math.PI*2);ctx.fill();
        if(br.over){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff5f57';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-10);ctx.fillStyle='#ccc';ctx.font='14px sans-serif';ctx.fillText('Score: '+br.score,W/2,H/2+20);}
    }
    function step(){
        if(!br||br.over)return;
        br.ball.x+=br.ball.dx;br.ball.y+=br.ball.dy;
        if(br.ball.x<br.ball.r||br.ball.x>W-br.ball.r)br.ball.dx*=-1;
        if(br.ball.y<br.ball.r)br.ball.dy*=-1;
        if(br.ball.y+br.ball.r>H-30&&br.ball.y<H-30+PH&&br.ball.x>br.paddle.x&&br.ball.x<br.paddle.x+br.paddle.w&&br.ball.dy>0){br.ball.dy*=-1;const hit=(br.ball.x-(br.paddle.x+br.paddle.w/2))/(br.paddle.w/2);br.ball.dx=hit*4;}
        br.bricks.forEach(b=>{if(!b.alive)return;if(br.ball.x>b.x&&br.ball.x<b.x+48&&br.ball.y>b.y&&br.ball.y<b.y+16){b.alive=false;br.ball.dy*=-1;br.score+=10;const s=document.getElementById('brScore');if(s)s.textContent=br.score;}});
        if(br.ball.y>H){br.lives--;const l=document.getElementById('brLives');if(l)l.textContent=br.lives;if(br.lives<=0)br.over=true;else{br.ball.x=W/2;br.ball.y=H-40;br.ball.dx=3;br.ball.dy=-3;}}
        if(br.bricks.every(b=>!b.alive))br.over=true;
        draw();
    }
    window.brReset=()=>reset();
    window.brKey=e=>{if(!br)return;if(e.key==='ArrowLeft'){br.paddle.x=Math.max(0,br.paddle.x-30);e.preventDefault();}if(e.key==='ArrowRight'){br.paddle.x=Math.min(W-PW,br.paddle.x+30);e.preventDefault();}};
    canvas.addEventListener('mousemove',e=>{if(!br)return;const r=canvas.getBoundingClientRect();br.paddle.x=Math.max(0,Math.min(W-PW,(e.clientX-r.left)-PW/2));});
    document.addEventListener('keydown',window.brKey);
    reset();
    clearInterval(window._brInt);
    window._brInt=setInterval(step,1000/60);
}

/* ============ 2048 ============ */
function start2048(){
    const html=`
        <div class="game-wrap">
            <button class="game-back" onclick="closeWin('game2048');openGameMenu()">← Back</button>
            <div class="game-hud">SCORE <b id="g2048Score">0</b> BEST <b id="g2048Best">${localStorage.getItem('g2048Best')||0}</b></div>
            <canvas id="g2048Canvas" class="game-canvas" width="360" height="360"></canvas>
            <button class="game-btn" onclick="g2048Reset()">New Game</button>
            <div class="game-help">Arrow keys or WASD to merge tiles</div>
        </div>`;
    createWindow('game2048','2048',400,500,html,'games');
    setTimeout(()=>g2048Init(),50);
}
let g2048State=null;
function g2048Init(){
    const canvas=document.getElementById('g2048Canvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const S=360, N=4, TILE=S/N;
    function reset(){
        g2048State={grid:Array.from({length:N},()=>Array(N).fill(0)),score:0,over:false};
        spawn();spawn();
        const s=document.getElementById('g2048Score');if(s)s.textContent=0;
        draw();
    }
    function spawn(){
        const empty=[];
        for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g2048State.grid[r][c])empty.push([r,c]);
        if(!empty.length)return;
        const [r,c]=empty[Math.floor(Math.random()*empty.length)];
        g2048State.grid[r][c]=Math.random()<0.9?2:4;
    }
    function draw(){
        ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,S,S);
        const colors={0:'#2a2a3e',2:'#3a3a52',4:'#4a4a66',8:'#7ab8ff',16:'#5a9fdf',32:'#a04bd4',64:'#8a3ab4',128:'#ff9d5c',256:'#ff7a3c',512:'#ff5f57',1024:'#febc2e',2048:'#4a7c59'};
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
            const v=g2048State.grid[r][c];
            ctx.fillStyle=colors[v]||'#fff';
            ctx.fillRect(c*TILE+4,r*TILE+4,TILE-8,TILE-8);
            if(v){
                ctx.fillStyle=v>4?'#fff':'#fff';
                ctx.font='bold '+(v>100?24:32)+'px sans-serif';
                ctx.textAlign='center';ctx.textBaseline='middle';
                ctx.fillText(String(v),c*TILE+TILE/2,r*TILE+TILE/2);
            }
        }
        if(g2048State.over){
            ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,S,S);
            ctx.fillStyle='#fff';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText('GAME OVER',S/2,S/2);
        }
    }
    function move(dir){
        if(!g2048State||g2048State.over)return;
        const g=g2048State.grid;
        function slide(row){
            let arr=row.filter(x=>x);
            let score=0;
            for(let i=0;i<arr.length-1;i++){
                if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr.splice(i+1,1);}
            }
            while(arr.length<N)arr.push(0);
            return {arr,score};
        }
        function rotate(g){
            const n=g.length;
            const res=Array.from({length:n},()=>Array(n).fill(0));
            for(let r=0;r<n;r++)for(let c=0;c<n;c++)res[c][n-1-r]=g[r][c];
            return res;
        }
        let rotated=g;
        for(let i=0;i<dir;i++)rotated=rotate(rotated);
        let changed=false, gained=0;
        rotated=rotated.map(row=>{
            const orig=row.join(',');
            const {arr,score}=slide(row);
            if(arr.join(',')!==orig)changed=true;
            gained+=score;
            return arr;
        });
        for(let i=0;i<(4-dir)%4;i++)rotated=rotate(rotated);
        g2048State.grid=rotated;
        if(changed){
            g2048State.score+=gained;
            const s=document.getElementById('g2048Score');if(s)s.textContent=g2048State.score;
            const best=parseInt(localStorage.getItem('g2048Best')||0);
            if(g2048State.score>best){localStorage.setItem('g2048Best',g2048State.score);const b=document.getElementById('g2048Best');if(b)b.textContent=g2048State.score;}
            spawn();
            if(!canMove())g2048State.over=true;
        }
        draw();
    }
    function canMove(){
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
            if(!g2048State.grid[r][c])return true;
            if(c<N-1&&g2048State.grid[r][c]===g2048State.grid[r][c+1])return true;
            if(r<N-1&&g2048State.grid[r][c]===g2048State.grid[r+1][c])return true;
        }
        return false;
    }
    window.g2048Reset=reset;
    window.g2048Key=e=>{
        if(!g2048State)return;
        if(e.key==='ArrowUp'||e.key==='w'){move(0);e.preventDefault();}
        if(e.key==='ArrowRight'||e.key==='d'){move(1);e.preventDefault();}
        if(e.key==='ArrowDown'||e.key==='s'){move(2);e.preventDefault();}
        if(e.key==='ArrowLeft'||e.key==='a'){move(3);e.preventDefault();}
    };
    document.addEventListener('keydown',window.g2048Key);
    reset();
}

function startSimon(){
    const html=`
        <div class="game-wrap">
            <button class="game-back" onclick="closeWin('simon');openGameMenu()">← Back</button>
            <div class="game-hud">LEVEL <b id="simonLevel">0</b> BEST <b id="simonBest">${localStorage.getItem('simonBest')||0}</b></div>
            <canvas id="simonCanvas" class="game-canvas" width="360" height="360"></canvas>
            <button class="game-btn" onclick="simonReset()">Start</button>
            <div class="game-help">Watch the pattern, then click the colors in order</div>
        </div>`;
    createWindow('simon','Simon',400,500,html,'games');
    setTimeout(()=>simonInit(),50);
}
let simon=null;
function simonInit(){
    const canvas=document.getElementById('simonCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const S=360, h=S/2, q=h;
    const colors=['#ff5f57','#febc2e','#4a7c59','#7ab8ff'];
    const pos=[{x:0,y:0,w:q,h:h},{x:q,y:0,w:q,h:h},{x:0,y:h,w:q,h:h},{x:q,y:h,w:q,h:h}];
    function reset(){
        simon={seq:[],step:0,playing:false,level:0};
        nextRound();
    }
    function nextRound(){
        simon.seq.push(Math.floor(Math.random()*4));
        simon.step=0;simon.playing=false;
        simon.level++;
        const l=document.getElementById('simonLevel');if(l)l.textContent=simon.level;
        const best=parseInt(localStorage.getItem('simonBest')||0);
        if(simon.level>best){localStorage.setItem('simonBest',simon.level);const b=document.getElementById('simonBest');if(b)b.textContent=simon.level;}
        playSeq();
    }
    function playSeq(){
        let i=0;
        function next(){
            if(i>=simon.seq.length){simon.playing=true;draw();return;}
            const idx=simon.seq[i++];
            flash(idx,()=>{setTimeout(next,250);});
        }
        next();
    }
    function flash(idx,cb){
        draw();
        ctx.fillStyle='rgba(255,255,255,.5)';
        const p=pos[idx];
        ctx.fillRect(p.x+4,p.y+4,p.w-8,p.h-8);
        setTimeout(()=>{draw();cb&&cb();},350);
    }
    function draw(){
        ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,S,S);
        pos.forEach((p,i)=>{
            ctx.fillStyle=colors[i];
            ctx.globalAlpha=0.5;
            ctx.fillRect(p.x+4,p.y+4,p.w-8,p.h-8);
            ctx.globalAlpha=1;
        });
    }
    canvas.addEventListener('click',e=>{
        if(!simon||!simon.playing)return;
        const r=canvas.getBoundingClientRect();
        const x=e.clientX-r.left, y=e.clientY-r.top;
        let idx=-1;
        pos.forEach((p,i)=>{if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h)idx=i;});
        if(idx<0)return;
        if(simon.seq[simon.step]===idx){
            simon.step++;
            flash(idx);
            if(simon.step===simon.seq.length){
                setTimeout(nextRound,600);
            }
        } else {
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillRect(0,0,S,S);
    ctx.fillStyle='#ff5f57';
    ctx.font='28px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('WRONG!', S/2, S/2-20);
    ctx.fillStyle='#ccc';
    ctx.font='16px sans-serif';
    ctx.fillText('Level reached: ' + simon.level, S/2, S/2+20);
        }
    });
    window.simonReset=reset;
    reset();
}

/* ============ WHACK-A-MOLE ============ */
function startWhack(){
    const html=`
        <div class="game-wrap">
            <button class="game-back" onclick="closeWin('whack');openGameMenu()">← Back</button>
            <div class="game-hud">SCORE <b id="whackScore">0</b> TIME <b id="whackTime">30</b>s</div>
            <canvas id="whackCanvas" class="game-canvas" width="400" height="400"></canvas>
            <button class="game-btn" onclick="whackReset()">Start</button>
            <div class="game-help">Click the moles before they hide — 30 seconds</div>
        </div>`;
    createWindow('whack','Whack-a-Mole',440,540,html,'games');
    setTimeout(()=>whackInit(),50);
}
let whack=null;
function whackInit(){
    const canvas=document.getElementById('whackCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const S=400, N=3, HOLE=S/N;
    function reset(){
        whack={score:0,time:30,over:false,mole:-1,moleTimer:0};
        const s=document.getElementById('whackScore');if(s)s.textContent=0;
        const t=document.getElementById('whackTime');if(t)t.textContent=30;
        clearInterval(window._whackTick);
        clearInterval(window._whackSpawn);
        window._whackTick=setInterval(()=>{
            if(!whack||whack.over)return;
            whack.time--;
            const t=document.getElementById('whackTime');if(t)t.textContent=whack.time;
            if(whack.time<=0){whack.over=true;clearInterval(window._whackTick);clearInterval(window._whackSpawn);}
        },1000);
        window._whackSpawn=setInterval(()=>{
            if(!whack||whack.over)return;
            whack.mole=Math.floor(Math.random()*9);
            setTimeout(()=>{if(whack&&!whack.over)whack.mole=-1;},900);
        },700);
    }
    function draw(){
        ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,S,S);
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
            const i=r*N+c;
            const x=c*HOLE, y=r*HOLE;
            ctx.fillStyle='#3a2a1a';
            ctx.beginPath();ctx.arc(x+HOLE/2,y+HOLE/2,HOLE/2-10,0,Math.PI*2);ctx.fill();
            if(whack&&whack.mole===i&&!whack.over){
                ctx.fillStyle='#8a5a3a';
                ctx.beginPath();ctx.arc(x+HOLE/2,y+HOLE/2,HOLE/2-20,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#000';
                ctx.beginPath();ctx.arc(x+HOLE/2-8,y+HOLE/2-5,3,0,Math.PI*2);ctx.fill();
                ctx.beginPath();ctx.arc(x+HOLE/2+8,y+HOLE/2-5,3,0,Math.PI*2);ctx.fill();
            }
        }
        if(whack&&whack.over){
            ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,S,S);
            ctx.fillStyle='#fff';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText('TIME UP!',S/2,S/2-20);
            ctx.fillStyle='#7ab8ff';ctx.font='20px sans-serif';
            ctx.fillText('Score: '+whack.score,S/2,S/2+20);
        }
    }
    canvas.addEventListener('click',e=>{
        if(!whack||whack.over)return;
        const r=canvas.getBoundingClientRect();
        const x=e.clientX-r.left, y=e.clientY-r.top;
        const c=Math.floor(x/HOLE), rr=Math.floor(y/HOLE);
        if(c<0||c>=N||rr<0||rr>=N)return;
        const i=rr*N+c;
        if(whack.mole===i){
            whack.score++;
            whack.mole=-1;
            const s=document.getElementById('whackScore');if(s)s.textContent=whack.score;
        }
    });
    window.whackReset=reset;
    reset();
    clearInterval(window._whackInt);
    window._whackInt=setInterval(draw,1000/30);
}
