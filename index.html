<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dreadOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;color:#e0e0e0;user-select:none;-webkit-font-smoothing:antialiased}

/* ============ BOOT ============ */
#boot{
    position:fixed;inset:0;background:#05050a;z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .9s cubic-bezier(.4,0,.2,1), visibility .9s;
}
#boot.hidden{opacity:0;visibility:hidden;pointer-events:none}
.boot-logo{font-size:2.8rem;font-weight:200;letter-spacing:10px;color:#fff;margin-bottom:6px}
.boot-sub{font-size:.7rem;color:#444;letter-spacing:4px;margin-bottom:44px}
.boot-bar{width:260px;height:2px;background:#15151e;border-radius:2px;overflow:hidden}
.boot-fill{height:100%;width:0;background:linear-gradient(90deg,#a04bd4,#4a7c59,#7ab8ff);transition:width .3s cubic-bezier(.4,0,.2,1);will-change:width}
.boot-status{font-size:.68rem;color:#333;margin-top:16px;font-family:'Courier New',monospace;letter-spacing:1px}

/* ============ DESKTOP ============ */
#desktop{
    position:absolute;inset:0;overflow:hidden;
    background:
        radial-gradient(ellipse 60% 80% at 15% 40%, rgba(160,75,212,.55), transparent 60%),
        radial-gradient(ellipse 50% 70% at 5% 80%, rgba(220,120,180,.45), transparent 60%),
        radial-gradient(ellipse 55% 65% at 30% 15%, rgba(90,60,180,.55), transparent 60%),
        radial-gradient(ellipse 45% 55% at 85% 20%, rgba(30,40,90,.7), transparent 65%),
        radial-gradient(ellipse 60% 80% at 90% 85%, rgba(20,25,60,.85), transparent 65%),
        linear-gradient(110deg, #1a0f2e 0%, #12082a 25%, #0a0a1e 55%, #05050d 85%);
    background-size:200% 200%;
    animation:bgShift 30s ease infinite;
    will-change:background-position;
}
#desktop.wallpaper{animation:none;background-size:cover;background-position:center}
@keyframes bgShift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}
#desktop::before{
    content:"";position:absolute;inset:-20%;pointer-events:none;
    background:
        radial-gradient(circle at 25% 55%, rgba(200,120,220,.25), transparent 35%),
        radial-gradient(circle at 45% 75%, rgba(120,60,200,.20), transparent 40%);
    filter:blur(40px);
    animation:blobMove 22s ease-in-out infinite alternate;
    will-change:transform;
}
@keyframes blobMove{
    0%{transform:translate3d(0,0,0) scale(1)}
    100%{transform:translate3d(6%,-4%,0) scale(1.08)}
}

/* ============ TOP BAR ============ */
#topbar{
    position:absolute;top:0;left:0;right:0;height:30px;
    background:rgba(10,10,18,.5);backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid rgba(255,255,255,.05);
    display:flex;align-items:center;padding:0 12px;gap:14px;
    font-size:.7rem;color:#aaa;z-index:900;
}
#topbar .brand{font-weight:600;color:#fff;letter-spacing:1.5px;font-size:.72rem}
#topbar .spacer{flex:1}
#topbar .tray{display:flex;gap:12px;align-items:center;color:#999;font-size:.68rem}
#topbar .chip{background:rgba(255,255,255,.06);padding:3px 9px;border-radius:10px;font-size:.65rem}

/* ============ DOCK ============ */
#dock{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    background:rgba(15,15,25,.55);backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    border:1px solid rgba(255,255,255,.08);border-radius:18px;
    padding:8px 12px;display:flex;gap:6px;z-index:900;
    box-shadow:0 12px 45px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);
    will-change:transform;
}
.dock-icon{
    width:42px;height:42px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.05rem;cursor:pointer;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.04);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), background .2s ease;
    position:relative;
    will-change:transform;
}
.dock-icon:hover{transform:translate3d(0,-9px,0) scale(1.1);background:rgba(255,255,255,.14)}
.dock-icon::after{
    content:attr(data-label);
    position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);
    font-size:.6rem;color:#ddd;background:rgba(0,0,0,.85);
    padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;
    white-space:nowrap;transition:opacity .18s ease;
}
.dock-icon:hover::after{opacity:1}
.dock-sep{width:1px;background:rgba(255,255,255,.08);margin:6px 3px}
.dock-indicator{
    position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;
    transition:opacity .2s ease;
}
.dock-icon.has-window .dock-indicator{opacity:.7}

/* ============ WINDOWS ============ */
.window{
    position:absolute;background:rgba(18,18,26,.94);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
    display:flex;flex-direction:column;
    min-width:280px;min-height:180px;
    opacity:0;
    transform:translate3d(0,12px,0) scale(.94);
    transition:opacity .28s cubic-bezier(.4,0,.2,1),
               transform .32s cubic-bezier(.34,1.4,.64,1),
               width .28s cubic-bezier(.4,0,.2,1),
               height .28s cubic-bezier(.4,0,.2,1),
               left .28s cubic-bezier(.4,0,.2,1),
               top .28s cubic-bezier(.4,0,.2,1);
    will-change:opacity,transform,width,height,left,top;
}
.window.open{opacity:1;transform:translate3d(0,0,0) scale(1)}
.window.closing{opacity:0;transform:translate3d(0,8px,0) scale(.93)}
.window.minimizing{
    opacity:0;
    transform:translate3d(0,400px,0) scale(.15);
    transition:opacity .28s ease, transform .34s cubic-bezier(.5,0,.7,.4);
}
.window.fullscreen{
    border-radius:0;
    left:0 !important;
    top:30px !important;
    width:100vw !important;
    height:calc(100vh - 30px) !important;
    transition:left .28s cubic-bezier(.4,0,.2,1),
               top .28s cubic-bezier(.4,0,.2,1),
               width .28s cubic-bezier(.4,0,.2,1),
               height .28s cubic-bezier(.4,0,.2,1),
               border-radius .2s ease;
}
.window.fullscreen .window-header{cursor:default}
.window-header{
    height:34px;background:rgba(255,255,255,.03);
    display:flex;align-items:center;padding:0 12px;gap:10px;
    cursor:grab;user-select:none;
    border-bottom:1px solid rgba(255,255,255,.05);
    flex-shrink:0;
}
.window-header:active{cursor:grabbing}
.window.fullscreen .window-header:active{cursor:default}
.window-dots{display:flex;gap:8px;align-items:center}
.dot{
    width:12px;height:12px;border-radius:50%;cursor:pointer;
    position:relative;
    transition:filter .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
    will-change:transform;
}
.dot::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;font-weight:900;color:rgba(0,0,0,.55);
    line-height:12px;text-align:center;opacity:0;
    transition:opacity .12s ease;
}
.window-header:hover .dot::before{opacity:1}
.dot.red{background:#ff5f57}
.dot.red::before{content:"✕"}
.dot.yellow{background:#febc2e}
.dot.yellow::before{content:"−"}
.dot.green{background:#28c840}
.dot.green::before{content:"+";font-size:10px}
.dot:hover{filter:brightness(1.2)}
.dot:active{transform:scale(.9)}
.window-title{flex:1;font-size:.74rem;color:#ccc;font-weight:500;letter-spacing:.3px;text-align:center}
.window-menu{font-size:.85rem;color:#888;cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .15s}
.window-menu:hover{background:rgba(255,255,255,.08);color:#ccc}
.window-body{flex:1;overflow:auto;position:relative;background:transparent}
.window-body::-webkit-scrollbar{width:8px;height:8px}
.window-body::-webkit-scrollbar-thumb{background:#2a2a35;border-radius:4px}
.window-body::-webkit-scrollbar-track{background:transparent}

/* ============ TERMINAL ============ */
.terminal{
    background:rgba(6,6,10,.96);color:#c8c8c8;
    font-family:'Menlo','Courier New',monospace;
    padding:14px;height:100%;overflow-y:auto;
    font-size:.76rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;
}
.terminal::-webkit-scrollbar{width:6px}
.terminal::-webkit-scrollbar-thumb{background:#252530;border-radius:3px}
.term-input{
    background:transparent;border:none;color:#c8c8c8;
    font-family:inherit;font-size:.76rem;
    outline:none;width:70%;caret-color:#c8c8c8;
}
.term-user{color:#7ab8ff}
.term-host{color:#a04bd4}
.term-path{color:#4a7c59}
.term-err{color:#ff5f57}

/* ============ SETTINGS ============ */
.settings-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.06)}
.settings-section:last-child{border-bottom:none;margin-bottom:0}
.settings-label{font-size:.66rem;color:#777;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.settings-btn{
    background:rgba(255,255,255,.06);color:#ddd;border:1px solid rgba(255,255,255,.08);
    padding:9px 16px;border-radius:8px;cursor:pointer;font-size:.76rem;
    transition:background .15s ease, transform .1s ease;
}
.settings-btn:hover{background:rgba(255,255,255,.12)}
.settings-btn:active{transform:scale(.97)}
.settings-btn.danger{background:rgba(200,60,60,.2);border-color:rgba(200,60,60,.3)}
.settings-btn.danger:hover{background:rgba(200,60,60,.35)}
.switch{position:relative;display:inline-block;width:42px;height:22px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#333;transition:.25s;border-radius:22px}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#ccc;transition:.25s cubic-bezier(.4,0,.2,1);border-radius:50%}
input:checked + .slider{background:#4a7c59}
input:checked + .slider:before{transform:translateX(20px)}

/* ============ IFRAME ============ */
.app-iframe{width:100%;height:100%;border:none;background:#fff;display:block}

/* ============ GITHUB ============ */
.gh-container{padding:0;height:100%;overflow-y:auto;background:#0d1117;color:#c9d1d9;font-size:.78rem}
.gh-topbar{padding:10px 16px;background:#010409;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.gh-topbar .url{flex:1;background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:5px 10px;color:#8b949e;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-topbar .gh-btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:.72rem}
.gh-topbar .gh-btn:hover{background:#30363d}
.gh-content{padding:20px 24px}
.gh-repo-title{font-size:1rem;margin-bottom:12px;color:#c9d1d9}
.gh-repo-title .owner{color:#58a6ff;font-weight:400}
.gh-repo-title .name{color:#58a6ff;font-weight:600}
.gh-badge{font-size:.65rem;padding:1px 7px;border:1px solid #30363d;border-radius:20px;color:#8b949e;margin-left:6px}
.gh-tabs{display:flex;gap:14px;border-bottom:1px solid #21262d;margin-bottom:16px;font-size:.76rem}
.gh-tabs div{padding:8px 0;color:#8b949e;cursor:pointer}
.gh-tabs div.active{color:#c9d1d9;border-bottom:2px solid #f78166;margin-bottom:-1px}
.gh-file-row{padding:7px 0;border-bottom:1px solid #161b22;display:flex;gap:10px;align-items:center;font-size:.76rem}
.gh-file-row .icon{color:#8b949e}
.gh-file-row .name{color:#58a6ff;cursor:pointer}
.gh-file-row .msg{color:#8b949e;flex:1}
.gh-file-row .time{color:#6e7681;font-size:.7rem}
.gh-readme{margin-top:20px;padding:16px;border:1px solid #21262d;border-radius:6px;background:#0d1117}
.gh-readme h2{font-size:.95rem;color:#c9d1d9;margin-bottom:8px;border-bottom:1px solid #21262d;padding-bottom:6px}
.gh-readme p{color:#8b949e;font-size:.75rem;line-height:1.6;margin-bottom:8px}

/* ============ DOOM ============ */
.doom-container{width:100%;height:100%;background:#000;position:relative;overflow:hidden}
.doom-placeholder{
    position:absolute;inset:0;
    background:
        linear-gradient(180deg,#3a2a1a 0%,#1a0f08 40%,#0a0503 100%),
        radial-gradient(circle at 50% 60%, rgba(180,100,30,.3), transparent 50%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#c9a86a;text-align:center;padding:20px;
}
.doom-placeholder::before{
    content:"";position:absolute;inset:0;
    background:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.25) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 40px, rgba(80,40,10,.15) 40px 42px);
    pointer-events:none;
}
.doom-hud{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(180deg,#3a1a1a,#1a0808);
    border-top:2px solid #6a3a1a;
    display:flex;justify-content:space-between;
    padding:8px 14px;font-family:'Courier New',monospace;
    font-size:.75rem;color:#e0c090;z-index:2;
}
.doom-hud .stat{display:flex;gap:6px;align-items:center}
.doom-hud .stat .val{color:#fff;font-weight:700;font-size:.95rem}
.doom-info{font-size:.7rem;color:#8a6a3a;margin-top:8px;letter-spacing:2px;text-transform:uppercase}

/* ============ CONTEXT MENU ============ */
#contextMenu{
    position:absolute;background:rgba(18,18,28,.97);backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.09);border-radius:10px;
    padding:6px;display:none;z-index:2000;min-width:190px;
    box-shadow:0 14px 40px rgba(0,0,0,.7);
    opacity:0;transform:scale(.96);
    transition:opacity .12s ease, transform .12s cubic-bezier(.34,1.4,.64,1);
}
#contextMenu.open{display:block;opacity:1;transform:scale(1)}
.ctx-item{padding:9px 14px;border-radius:6px;cursor:pointer;font-size:.76rem;color:#ddd;transition:background .12s}
.ctx-item:hover{background:rgba(255,255,255,.09)}

/* ============ NOTEPAD / CALC ============ */
.notepad-textarea{
    width:100%;height:100%;background:rgba(12,12,18,.7);color:#ddd;
    border:none;outline:none;resize:none;padding:14px;
    font-family:'Courier New',monospace;font-size:.8rem;line-height:1.5;
}
.calc-display{background:rgba(0,0,0,.45);color:#fff;padding:16px;text-align:right;
    font-size:1.55rem;border-radius:8px;margin-bottom:10px;min-height:2em;
    word-wrap:break-word;font-weight:300;letter-spacing:1px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-grid button{padding:14px 0;background:rgba(255,255,255,.06);color:#ddd;
    border:1px solid rgba(255,255,255,.05);border-radius:8px;cursor:pointer;
    font-size:1rem;transition:background .12s ease, transform .08s ease}
.calc-grid button:hover{background:rgba(255,255,255,.12)}
.calc-grid button:active{transform:scale(.96)}
.calc-grid button.op{color:#7ab8ff}
.calc-grid button.eq{background:linear-gradient(135deg,#4a7c59,#3a6c49);color:#fff}

.masked-url{
    flex:1;padding:6px 12px;background:rgba(0,0,0,.35);border-radius:6px;
    font-size:.72rem;color:#888;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:'Menlo','Courier New',monospace;
    letter-spacing:1.5px;
}
</style>
</head>
<body>

<div id="boot">
    <div class="boot-logo">dreadOS</div>
    <div class="boot-sub">VERSION 1.0</div>
    <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
    <div class="boot-status" id="bootStatus">initializing...</div>
</div>

<div id="desktop"></div>

<div id="topbar">
    <span class="brand">dreadOS</span>
    <span class="spacer"></span>
    <div class="tray">
        <span class="chip" id="trayBattery">100%</span>
        <span class="chip" id="trayWifi">wifi</span>
        <span id="trayDate"></span>
        <span id="trayClock">--:--</span>
    </div>
</div>

<div id="dock">
    <div class="dock-icon" data-app="terminal" data-label="Terminal" onclick="openApp('terminal')">▣<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="chrome" data-label="Chrome" onclick="openApp('chrome')">◐<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="settings" data-label="Files" onclick="openApp('settings')">▤<span class="dock-indicator"></span></div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-app="github" data-label="GitHub" onclick="openApp('github')">◉<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="doom" data-label="DOOM" onclick="openApp('doom')">☠<span class="dock-indicator"></span></div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-app="settings2" data-label="Settings" onclick="openApp('settings')">⚙<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="notepad" data-label="Notepad" onclick="openApp('notepad')">✎<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="calculator" data-label="Calculator" onclick="openApp('calculator')">±<span class="dock-indicator"></span></div>
</div>

<div id="contextMenu">
    <div class="ctx-item" onclick="openApp('terminal')">Open Terminal</div>
    <div class="ctx-item" onclick="openApp('github')">Open GitHub</div>
    <div class="ctx-item" onclick="openApp('doom')">Open DOOM</div>
    <div class="ctx-item" onclick="openApp('settings')">Change Wallpaper</div>
    <div class="ctx-item" onclick="closeAllWindows()">Close All Windows</div>
</div>

<script>
/* ============ BOOT ============ */
const bootSteps = [
    [12,"loading kernel modules..."],[28,"initializing display server..."],
    [46,"mounting virtual filesystem..."],[64,"starting window manager..."],
    [80,"loading user profile..."],[94,"applying wallpaper..."],[100,"welcome, dread."]
];
let bi=0;
(function runBoot(){
    if(bi>=bootSteps.length){
        setTimeout(()=>{
            document.getElementById('boot').classList.add('hidden');
            setTimeout(()=>openApp('terminal'),400);
        },500);
        return;
    }
    const [p,m]=bootSteps[bi++];
    document.getElementById('bootFill').style.width=p+'%';
    document.getElementById('bootStatus').textContent=m;
    setTimeout(runBoot,340);
})();

/* ============ DESKTOP ============ */
const desktop=document.getElementById('desktop');
const savedBg=localStorage.getItem('dreados_bg');
if(savedBg){desktop.classList.add('wallpaper');desktop.style.backgroundImage=`url(${savedBg})`}

/* ============ CLOCK ============ */
function updateClock(){
    const d=new Date();
    document.getElementById('trayClock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    document.getElementById('trayDate').textContent=d.toLocaleDateString([],{month:'short',day:'numeric'});
}
setInterval(updateClock,1000);updateClock();
if(navigator.getBattery){
    navigator.getBattery().then(b=>{
        const upd=()=>document.getElementById('trayBattery').textContent=Math.round(b.level*100)+'%';
        upd();b.addEventListener('levelchange',upd);
    });
} else { document.getElementById('trayBattery').style.display='none'; }
document.getElementById('trayWifi').textContent = navigator.onLine ? 'wifi' : 'offline';

/* ============ WINDOW MANAGER ============ */
let zTop=100;
const windows={};              // id -> {el, app}
const minimized={};            // id -> true

function createWindow(id, title, w, h, bodyHTML, appName){
    if(windows[id]){
        if(minimized[id]){
            const el=windows[id].el;
            el.style.visibility='';
            el.classList.remove('minimizing');
            minimized[id]=false;
        }
        focusWin(id);
        return;
    }
    const win=document.createElement('div');
    win.className='window';
    win.id='win-'+id;
    const off=Object.keys(windows).length*28;
    win.style.left=(Math.max(30,(window.innerWidth-w)/2+off-70))+'px';
    win.style.top=(Math.max(40,(window.innerHeight-h)/2+off-50))+'px';
    win.style.width=w+'px';
    win.style.height=h+'px';
    win.style.zIndex=++zTop;

    win.innerHTML=`
        <div class="window-header">
            <div class="window-dots">
                <div class="dot red"    onclick="event.stopPropagation();closeWin('${id}')"     title="Close"></div>
                <div class="dot yellow" onclick="event.stopPropagation();minimizeWin('${id}')"  title="Minimize"></div>
                <div class="dot green"  onclick="event.stopPropagation();toggleFullscreen('${id}')" title="Fullscreen"></div>
            </div>
            <div class="window-title">${title}</div>
            <div class="window-menu" onclick="event.stopPropagation();">⋯</div>
        </div>
        <div class="window-body" id="body-${id}">${bodyHTML}</div>
    `;
    document.body.appendChild(win);
    requestAnimationFrame(()=>win.classList.add('open'));

    const header=win.querySelector('.window-header');
    let drag=false,sx,sy,sl,st;
    header.addEventListener('mousedown',e=>{
        if(e.target.classList.contains('dot')||e.target.classList.contains('window-menu'))return;
        if(win.classList.contains('fullscreen'))return;
        drag=true;sx=e.clientX;sy=e.clientY;
        sl=win.offsetLeft;st=win.offsetTop;
        focusWin(id);
    });
    document.addEventListener('mousemove',e=>{
        if(!drag)return;
        win.style.left=(sl+e.clientX-sx)+'px';
        win.style.top=(st+e.clientY-sy)+'px';
    });
    document.addEventListener('mouseup',()=>drag=false);
    win.addEventListener('mousedown',()=>focusWin(id));

    windows[id]={el:win, app:appName||id};
    updateDockIndicators();
    updateWinCount();
    return win;
}

function focusWin(id){
    const w=windows[id];
    if(!w)return;
    if(minimized[id]){
        w.el.style.visibility='';
        w.el.classList.remove('minimizing');
        minimized[id]=false;
    }
    w.el.style.zIndex=++zTop;
    updateDockIndicators();
}

function closeWin(id){
    const w=windows[id];if(!w)return;
    w.el.classList.add('closing');
    setTimeout(()=>{
        w.el.remove();
        delete windows[id];
        delete minimized[id];
        updateDockIndicators();
        updateWinCount();
    },220);
    updateWinCount();
}

function minimizeWin(id){
    const w=windows[id];if(!w)return;
    w.el.classList.add('minimizing');
    minimized[id]=true;
    setTimeout(()=>{ if(windows[id]) w.el.style.visibility='hidden'; },340);
}

function toggleFullscreen(id){
    const w=windows[id];if(!w)return;
    const isFull=w.el.classList.contains('fullscreen');
    if(isFull){
        w.el.classList.remove('fullscreen');
        if(w.el.dataset.prev){
            const p=JSON.parse(w.el.dataset.prev);
            w.el.style.left=p.left;
            w.el.style.top=p.top;
            w.el.style.width=p.width;
            w.el.style.height=p.height;
        }
    } else {
        w.el.dataset.prev=JSON.stringify({
            left:w.el.style.left, top:w.el.style.top,
            width:w.el.style.width, height:w.el.style.height
        });
        w.el.classList.add('fullscreen');
    }
    focusWin(id);
}

function closeAllWindows(){Object.keys(windows).forEach(closeWin);}

function updateDockIndicators(){
    document.querySelectorAll('.dock-icon').forEach(ic=>{
        const app=ic.dataset.app;
        const hasOpen=Object.values(windows).some(w=>w.app===app);
        ic.classList.toggle('has-window', hasOpen);
    });
}
function updateWinCount(){
    const el=document.getElementById('winCount');
    if(el) el.textContent=Object.keys(windows).length;
}

/* ============ TERMINAL ============ */
function openTerminal(){
    const html=`
        <div class="terminal" id="termOut">
<span style="color:#666">Welcome to dreadOS 1.0 — type "help" for commands.</span>
<span id="termPrompt"><span class="term-user">dread</span><span style="color:#666">@</span><span class="term-host">dreados</span><span class="term-path">:~$</span></span> <input class="term-input" id="termIn" autocomplete="off" spellcheck="false">
        </div>`;
    createWindow('terminal','Terminal',640,420,html,'terminal');
    setTimeout(()=>{
        const inp=document.getElementById('termIn');
        if(!inp)return;
        inp.focus();
        inp.addEventListener('keydown',e=>{
            if(e.key==='Enter'){const c=inp.value.trim();inp.value='';handleCmd(c);}
        });
        document.getElementById('termOut').addEventListener('click',()=>inp.focus());
        setTimeout(()=>printSpecs(),500);
    },80);
}
function printTerm(html){
    const out=document.getElementById('termOut');
    const prompt=document.getElementById('termPrompt');
    const input=document.getElementById('termIn');
    if(!out||!prompt)return;
    const line=document.createElement('div');
    line.innerHTML=html;
    out.insertBefore(line,prompt);
    out.scrollTop=out.scrollHeight;
}
function handleCmd(cmd){
    printTerm(`<span class="term-user">dread</span><span style="color:#666">@</span><span class="term-host">dreados</span><span class="term-path">:~$</span> ${cmd}`);
    const c=cmd.toLowerCase().trim();
    if(c==='help'){
        printTerm('Commands:');
        printTerm('  help          — this list');
        printTerm('  specs         — device specs');
        printTerm('  neofetch      — fancy sysinfo');
        printTerm('  clear         — clear screen');
        printTerm('  date          — current time');
        printTerm('  whoami        — current user');
        printTerm('  echo [text]   — repeat');
        printTerm('  open chrome   — launch chrome');
        printTerm('  open doom     — launch doom');
        printTerm('  open github   — launch github view');
        printTerm('  open settings — launch settings');
        printTerm('  open notepad  — launch notepad');
    }
    else if(c==='clear'){
        const out=document.getElementById('termOut');
        if(!out)return;
        out.innerHTML=`<span id="termPrompt"><span class="term-user">dread</span><span style="color:#666">@</span><span class="term-host">dreados</span><span class="term-path">:~$</span></span> <input class="term-input" id="termIn" autocomplete="off" spellcheck="false">`;
        const inp=document.getElementById('termIn');
        if(inp){
            inp.focus();
            inp.addEventListener('keydown',e=>{if(e.key==='Enter'){handleCmd(inp.value.trim());inp.value='';}});
        }
    }
    else if(c==='specs'||c==='neofetch'){printSpecs();}
    else if(c==='date'){printTerm(new Date().toString());}
    else if(c==='whoami'){printTerm('dread');}
    else if(c.startsWith('echo ')){printTerm(cmd.substring(5));}
    else if(c==='open chrome'){openChrome();printTerm('launching chrome...');}
    else if(c==='open doom'){openDoom();printTerm('launching doom...');}
    else if(c==='open github'){openGithub();printTerm('launching github view...');}
    else if(c==='open settings'){openSettings();printTerm('launching settings...');}
    else if(c==='open notepad'){openNotepad();printTerm('launching notepad...');}
    else if(cmd===''){}
    else{printTerm(`<span class="term-err">unknown command: ${cmd}</span>`);}
}
function printSpecs(){
    const gl=document.createElement('canvas').getContext('webgl');
    const dbg=gl.getExtension('WEBGL_debug_renderer_info');
    const gpu=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'unknown';
    const lines=[
        '        ▄▄▄▄▄▄▄▄▄▄▄        ',
        '      ▄█  dreadOS  █▄      ',
        '     ██  ─────────  ██     ',
        '      ▀▀▀▀▀▀▀▀▀▀▀▀▀        ',
        '',
        ' OS       dreadOS 1.0 (browser)',
        ' Host     '+(navigator.userAgentData?.platform||navigator.platform||'unknown'),
        ' Kernel   '+(navigator.userAgent.match(/(Chrome|Firefox|Safari|Edg)\/[\d.]+/)?.[0]||'unknown'),
        ' Uptime   '+Math.floor(performance.now()/1000)+'s',
        ' Shell    dreadsh 1.0',
        ' Res      '+screen.width+'x'+screen.height,
        ' CPU      '+(navigator.hardwareConcurrency||'unknown')+' cores',
        ' RAM      '+(navigator.deviceMemory?navigator.deviceMemory+' GB':'unknown'),
        ' GPU      '+gpu,
        ' Lang     '+navigator.language,
        ' Touch    '+(navigator.maxTouchPoints>0?'yes':'no'),
        ' Online   '+(navigator.onLine?'yes':'no')
    ];
    lines.forEach(l=>printTerm(l.replace(/ /g,'&nbsp;')));
}

    const html=`

            </div>

function uploadBg(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
        desktop.classList.add('wallpaper');
        desktop.style.backgroundImage=`url(${ev.target.result})`;
        try{localStorage.setItem('dreados_bg',ev.target.result);}
        catch{alert('Image too large to save permanently. Works this session.');}
    };
    r.readAsDataURL(f);
}
function resetBg(){
    desktop.classList.remove('wallpaper');
    desktop.style.backgroundImage='';
    localStorage.removeItem('dreados_bg');
}
function toggleAnim(){
    const on=document.getElementById('animToggle').checked;
    if(on&&!localStorage.getItem('dreados_bg')){desktop.classList.remove('wallpaper');}
    else if(!on){
        const bg=localStorage.getItem('dreados_bg');
        desktop.style.backgroundImage=bg?`url(${bg})`:'linear-gradient(135deg,#1a0f2e,#05050d)';
        desktop.classList.add('wallpaper');
    }
}

/* ============ CALCULATOR ============ */
function openCalculator(){
    const html=`
        <div style="padding:14px">
            <div class="calc-display" id="cd">0</div>
            <div class="calc-grid">
                <button onclick="cClear()">C</button><button onclick="cDel()">⌫</button>
                <button class="op" onclick="cOp('%')">%</button><button class="op" onclick="cOp('/')">/</button>
                <button onclick="cN('7')">7</button><button onclick="cN('8')">8</button><button onclick="cN('9')">9</button><button class="op" onclick="cOp('*')">×</button>
                <button onclick="cN('4')">4</button><button onclick="cN('5')">5</button><button onclick="cN('6')">6</button><button class="op" onclick="cOp('-')">−</button>
                <button onclick="cN('1')">1</button><button onclick="cN('2')">2</button><button onclick="cN('3')">3</button><button class="op" onclick="cOp('+')">+</button>
                <button onclick="cN('0')" style="grid-column:span 2">0</button><button onclick="cN('.')">.</button><button class="eq" onclick="cEq()">=</button>
            </div>
        </div>`;
    createWindow('calculator','Calculator',320,440,html,'calculator');
}
let cE='';
function cN(n){cE+=n;const d=document.getElementById('cd');if(d)d.textContent=cE}
function cOp(o){cE+=o;const d=document.getElementById('cd');if(d)d.textContent=cE}
function cClear(){cE='';const d=document.getElementById('cd');if(d)d.textContent='0'}
function cDel(){cE=cE.slice(0,-1);const d=document.getElementById('cd');if(d)d.textContent=cE||'0'}
function cEq(){try{const r=Function('"use strict";return('+cE+')')();const d=document.getElementById('cd');if(d)d.textContent=r;cE=String(r)}catch{const d=document.getElementById('cd');if(d)d.textContent='error';cE=''}}

/* ============ CONTEXT MENU ============ */
const ctx=document.getElementById('contextMenu');
document.addEventListener('contextmenu',e=>{
    if(e.target.closest('.window'))return;
    e.preventDefault();
    ctx.style.left=e.clientX+'px';
    ctx.style.top=e.clientY+'px';
    ctx.classList.add('open');
});
document.addEventListener('click',e=>{if(!e.target.closest('#contextMenu'))ctx.classList.remove('open');});
