<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreadOS</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; color: #e0e0e0; }

    /* Desktop */
    #desktop {
        position: absolute; inset: 0;
        background-size: cover; background-position: center;
        background-color: #2a2a2e;
        background-image: linear-gradient(135deg, #2a2a2e 0%, #1a1a1a 100%);
    }

    /* Taskbar */
    #taskbar {
        position: absolute; bottom: 0; left: 0; right: 0;
        height: 48px;
        background: rgba(20, 20, 22, 0.92);
        backdrop-filter: blur(10px);
        border-top: 1px solid #3a3a3e;
        display: flex; align-items: center; padding: 0 12px;
        gap: 10px; z-index: 1000;
    }
    #startBtn {
        background: #3a3a3e; color: #fff; border: none;
        padding: 8px 14px; border-radius: 6px; cursor: pointer;
        font-weight: 600; font-size: 0.85rem;
    }
    #startBtn:hover { background: #4a4a4e; }
    #taskbarApps { display: flex; gap: 6px; flex: 1; overflow-x: auto; }
    .taskbar-app {
        background: #2a2a2e; color: #ccc; border: 1px solid #3a3a3e;
        padding: 6px 12px; border-radius: 6px; cursor: pointer;
        font-size: 0.8rem; white-space: nowrap;
    }
    .taskbar-app:hover { background: #3a3a3e; }
    #clock { color: #ccc; font-size: 0.8rem; font-variant-numeric: tabular-nums; }

    /* Start menu */
    #startMenu {
        position: absolute; bottom: 56px; left: 12px;
        background: rgba(30, 30, 34, 0.98);
        border: 1px solid #3a3a3e; border-radius: 10px;
        padding: 8px; min-width: 200px; display: none;
        z-index: 1001; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #startMenu.open { display: block; }
    .menu-item {
        padding: 10px 14px; border-radius: 6px; cursor: pointer;
        font-size: 0.85rem; color: #ddd;
    }
    .menu-item:hover { background: #3a3a3e; }

    /* Windows */
    .window {
        position: absolute;
        background: #25252a;
        border: 1px solid #3a3a3e;
        border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        display: flex; flex-direction: column;
        min-width: 320px; min-height: 240px;
        overflow: hidden;
    }
    .window-header {
        height: 36px; background: #2f2f34;
        display: flex; align-items: center; padding: 0 12px;
        cursor: grab; user-select: none;
        border-bottom: 1px solid #3a3a3e;
    }
    .window-header:active { cursor: grabbing; }
    .window-title { flex: 1; font-size: 0.85rem; color: #ddd; font-weight: 500; }
    .window-close {
        width: 24px; height: 24px; border-radius: 6px;
        background: #3a3a3e; border: none; color: #ccc;
        cursor: pointer; font-size: 0.8rem;
    }
    .window-close:hover { background: #a35c5c; color: #fff; }
    .window-body { flex: 1; overflow: auto; padding: 14px; font-size: 0.85rem; color: #ccc; }

    /* Terminal */
    .terminal {
        background: #0d0d0d; color: #b8ffb8;
        font-family: 'Courier New', monospace;
        padding: 12px; height: 100%;
        overflow-y: auto; font-size: 0.8rem; line-height: 1.5;
        white-space: pre-wrap; word-wrap: break-word;
    }
    .terminal input {
        background: transparent; border: none; color: #b8ffb8;
        font-family: 'Courier New', monospace; font-size: 0.8rem;
        outline: none; width: 80%;
    }

    /* Settings */
    .settings-section {
        margin-bottom: 18px; padding-bottom: 18px;
        border-bottom: 1px solid #3a3a3e;
    }
    .settings-section:last-child { border-bottom: none; }
    .settings-label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .settings-btn {
        background: #3a3a3e; color: #ddd; border: none;
        padding: 10px 16px; border-radius: 6px; cursor: pointer;
        font-size: 0.85rem; margin-right: 8px;
    }
    .settings-btn:hover { background: #4a4a4e; }
    .settings-btn.danger { background: #a35c5c; color: #fff; }

    /* Toggle switch */
    .switch {
        position: relative; display: inline-block;
        width: 44px; height: 24px; margin-left: 10px; vertical-align: middle;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
        position: absolute; cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #3a3a3e; transition: .2s;
        border-radius: 24px;
    }
    .slider:before {
        position: absolute; content: "";
        height: 18px; width: 18px; left: 3px; bottom: 3px;
        background-color: #ccc; transition: .2s;
        border-radius: 50%;
    }
    input:checked + .slider { background-color: #4a7c59; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Iframe apps */
    .app-iframe { width: 100%; height: 100%; border: none; background: #fff; }

    /* Notepad */
    .notepad-textarea {
        width: 100%; height: 100%; background: #1a1a1a; color: #ddd;
        border: none; outline: none; resize: none; padding: 10px;
        font-family: 'Courier New', monospace; font-size: 0.85rem;
    }

    /* Calculator */
    .calc-display {
        background: #1a1a1a; color: #fff; padding: 14px;
        text-align: right; font-size: 1.5rem; border-radius: 6px;
        margin-bottom: 10px; min-height: 2em; word-wrap: break-word;
    }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .calc-grid button {
        padding: 14px 0; background: #2f2f34; color: #ddd;
        border: none; border-radius: 6px; cursor: pointer;
        font-size: 1rem;
    }
    .calc-grid button:hover { background: #3f3f44; }
    .calc-grid button.op { color: #7ab8ff; }
    .calc-grid button.eq { background: #4a7c59; color: #fff; }
</style>
</head>
<body>

<div id="desktop"></div>

<div id="startMenu">
    <div class="menu-item" onclick="openApp('terminal')">Terminal</div>
    <div class="menu-item" onclick="openApp('chrome')">Chrome</div>
    <div class="menu-item" onclick="openApp('settings')">Settings</div>
    <div class="menu-item" onclick="openApp('notepad')">Notepad</div>
    <div class="menu-item" onclick="openApp('calculator')">Calculator</div>
    <div class="menu-item" onclick="openApp('about')">About DreadOS</div>
</div>

<div id="taskbar">
    <button id="startBtn" onclick="toggleStart()">dreadOS</button>
    <div id="taskbarApps"></div>
    <div id="clock">--:--</div>
</div>

<script>
// ============ DESKTOP BACKGROUND ============
const desktop = document.getElementById('desktop');
const savedBg = localStorage.getItem('dreados_bg');
if (savedBg) desktop.style.backgroundImage = `url(${savedBg})`;

// ============ CLOCK ============
function updateClock() {
    const d = new Date();
    document.getElementById('clock').textContent =
        d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ============ START MENU ============
function toggleStart() {
    document.getElementById('startMenu').classList.toggle('open');
}
document.addEventListener('click', (e) => {
    if (!e.target.closest('#startBtn') && !e.target.closest('#startMenu')) {
        document.getElementById('startMenu').classList.remove('open');
    }
});

// ============ WINDOW MANAGER ============
let windowZ = 100;
const openWindows = {};

function createWindow(id, title, width, height, contentHTML) {
    // If already open, focus it
    if (openWindows[id]) { focusWindow(id); return; }

    const win = document.createElement('div');
    win.className = 'window';
    win.id = 'win-' + id;
    const offset = Object.keys(openWindows).length * 30;
    win.style.left = (80 + offset) + 'px';
    win.style.top = (60 + offset) + 'px';
    win.style.width = width + 'px';
    win.style.height = height + 'px';
    win.style.zIndex = ++windowZ;

    win.innerHTML = `
        <div class="window-header">
            <div class="window-title">${title}</div>
            <button class="window-close" onclick="closeWindow('${id}')">✕</button>
        </div>
        <div class="window-body" id="body-${id}">${contentHTML}</div>
    `;
    document.body.appendChild(win);

    // Drag
    const header = win.querySelector('.window-header');
    let dragging = false, startX, startY, startLeft, startTop;
    header.addEventListener('mousedown', (e) => {
        dragging = true;
        startX = e.clientX; startY = e.clientY;
        startLeft = win.offsetLeft; startTop = win.offsetTop;
        focusWindow(id);
    });
    document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        win.style.left = (startLeft + e.clientX - startX) + 'px';
        win.style.top = (startTop + e.clientY - startY) + 'px';
    });
    document.addEventListener('mouseup', () => { dragging = false; });

    // Click to focus
    win.addEventListener('mousedown', () => focusWindow(id));

    openWindows[id] = true;
    addTaskbarApp(id, title);
    return win;
}

function focusWindow(id) {
    const win = document.getElementById('win-' + id);
    if (win) win.style.zIndex = ++windowZ;
}

function closeWindow(id) {
    const win = document.getElementById('win-' + id);
    if (win) win.remove();
    delete openWindows[id];
    const task = document.getElementById('task-' + id);
    if (task) task.remove();
}

function addTaskbarApp(id, title) {
    const btn = document.createElement('div');
    btn.className = 'taskbar-app';
    btn.id = 'task-' + id;
    btn.textContent = title;
    btn.onclick = () => focusWindow(id);
    document.getElementById('taskbarApps').appendChild(btn);
}

// ============ APPS ============
function openApp(name) {
    document.getElementById('startMenu').classList.remove('open');
    if (name === 'terminal') openTerminal();
    else if (name === 'chrome') openChrome();
    else if (name === 'settings') openSettings();
    else if (name === 'notepad') openNotepad();
    else if (name === 'calculator') openCalculator();
    else if (name === 'about') openAbout();
}

// ---- TERMINAL ----
function openTerminal() {
    const content = `
        <div class="terminal" id="terminalOutput">dreadOS Terminal v1.0
Type "help" for commands.
<span id="termPrompt">dread@dreados:~$ </span><input type="text" id="termInput" autofocus>
</div>`;
    createWindow('terminal', 'Terminal', 620, 400, content);
    setTimeout(() => {
        const input = document.getElementById('termInput');
        if (input) input.focus();
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.trim();
                handleTerminalCommand(cmd);
                input.value = '';
            }
        });
    }, 50);
}

function printTerm(text) {
    const out = document.getElementById('terminalOutput');
    const prompt = document.getElementById('termPrompt');
    const input = document.getElementById('termInput');
    const span = document.createElement('span');
    span.textContent = text + '\n';
    out.insertBefore(span, prompt);
    out.scrollTop = out.scrollHeight;
}

function handleTerminalCommand(cmd) {
    printTerm('dread@dreados:~$ ' + cmd);
    const lower = cmd.toLowerCase().trim();

    if (lower === 'help') {
        printTerm('Commands:');
        printTerm('  help          - show this list');
        printTerm('  specs         - show device specs');
        printTerm('  clear         - clear the terminal');
        printTerm('  echo [text]   - print text');
        printTerm('  date          - show current date/time');
        printTerm('  whoami        - show current user');
        printTerm('  open chrome   - launch the Chrome app');
        printTerm('  open settings - launch Settings');
        printTerm('  neofetch      - fancy system info');
    }
    else if (lower === 'clear') {
        const out = document.getElementById('terminalOutput');
        out.innerHTML = 'Type "help" for commands.\n<span id="termPrompt">dread@dreados:~$ </span><input type="text" id="termInput" autofocus>';
        const input = document.getElementById('termInput');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleTerminalCommand(input.value.trim());
                input.value = '';
            }
        });
        input.focus();
    }
    else if (lower === 'specs' || lower === 'neofetch') {
        printSpecs();
    }
    else if (lower === 'date') {
        printTerm(new Date().toString());
    }
    else if (lower === 'whoami') {
        printTerm('dread');
    }
    else if (lower.startsWith('echo ')) {
        printTerm(cmd.substring(5));
    }
    else if (lower === 'open chrome') {
        openChrome();
        printTerm('Launching Chrome...');
    }
    else if (lower === 'open settings') {
        openSettings();
        printTerm('Launching Settings...');
    }
    else if (cmd === '') {
        // do nothing
    }
    else {
        printTerm(`Unknown command: ${cmd}. Type "help" for a list.`);
    }
}

function printSpecs() {
    const gl = document.createElement('canvas').getContext('webgl');
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Unknown';

    printTerm('        ,--.        ');
    printTerm('       /    \\       dreadOS 1.0');
    printTerm('      |      |      -----------------');
    printTerm('      |  /\\  |      OS:        dreadOS 1.0 (browser-based)');
    printTerm('       \\ -- /       Host:      ' + (navigator.platform || 'Unknown'));
    printTerm('        `--\'        Kernel:    ' + navigator.userAgent.match(/Chrome\/([\d.]+)/)?.[0] || 'Unknown');
    printTerm('                    Uptime:    ' + Math.floor(performance.now() / 1000) + 's');
    printTerm('                    Shell:     dreadsh 1.0');
    printTerm('                    Resolution:' + screen.width + 'x' + screen.height);
    printTerm('                    CPU Cores: ' + (navigator.hardwareConcurrency || 'Unknown'));
    printTerm('                    RAM (approx): ' + (navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown'));
    printTerm('                    GPU:       ' + gpu);
    printTerm('                    Language:  ' + navigator.language);
    printTerm('                    Platform:  ' + (navigator.userAgentData?.platform || navigator.platform));
    printTerm('                    Touch:     ' + (navigator.maxTouchPoints > 0 ? 'Yes' : 'No'));
    printTerm('                    Online:    ' + (navigator.onLine ? 'Yes' : 'No'));
}

// ---- CHROME ----
function openChrome() {
    const url = 'https://s3.amazonaws.com/cleverlearning/index.html';
    const content = `
        <div style="display:flex;flex-direction:column;height:100%;margin:-14px;padding:0;">
            <div style="display:flex;gap:6px;padding:8px;background:#2f2f34;border-bottom:1px solid #3a3a3e;align-items:center;">
                <button class="settings-btn" onclick="reloadChrome()" style="padding:6px 12px;">Reload</button>
                <div style="flex:1;padding:6px 12px;background:#1a1a1a;border-radius:6px;font-size:0.75rem;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${url}</div>
                <button class="settings-btn" onclick="openChromeTab()" style="padding:6px 12px;">Open Tab</button>
            </div>
            <iframe id="chromeFrame" src="${url}" class="app-iframe" style="flex:1;" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation"></iframe>
        </div>`;
    createWindow('chrome', 'Chrome', 800, 560, content);
}

function reloadChrome() {
    const f = document.getElementById('chromeFrame');
    if (f) f.src = f.src;
}
function openChromeTab() {
    window.open('https://s3.amazonaws.com/cleverlearning/index.html', '_blank');
}

// ---- SETTINGS ----
function openSettings() {
    const content = `
        <div class="settings-section">
            <div class="settings-label">Appearance</div>
            <p style="margin-bottom:10px;color:#999;font-size:0.8rem;">Upload an image to set as your desktop wallpaper. It saves to your browser.</p>
            <button class="settings-btn" onclick="document.getElementById('bgUpload').click()">Upload Image</button>
            <button class="settings-btn danger" onclick="resetBg()">Reset Wallpaper</button>
            <input type="file" id="bgUpload" accept="image/*" style="display:none;" onchange="uploadBg(event)">
        </div>
        <div class="settings-section">
            <div class="settings-label">Quick Toggle — Dark / Light Hint</div>
            <p style="margin-bottom:10px;color:#999;font-size:0.8rem;">Flip the switch to tint the taskbar.</p>
            <label class="switch">
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="settings-section">
            <div class="settings-label">System Info</div>
            <p style="color:#999;font-size:0.8rem;line-height:1.6;">
                OS: dreadOS 1.0<br>
                User: dread<br>
                Open apps: <span id="openAppCount">0</span>
            </p>
        </div>`;
    createWindow('settings', 'Settings', 460, 480, content);
    updateAppCount();
}

function uploadBg(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const dataUrl = e.target.result;
        desktop.style.backgroundImage = `url(${dataUrl})`;
        try {
            localStorage.setItem('dreados_bg', dataUrl);
        } catch (err) {
            alert('Image too large to save. It will work for this session only.');
        }
    };
    reader.readAsDataURL(file);
}

function resetBg() {
    desktop.style.backgroundImage = 'linear-gradient(135deg, #2a2a2e 0%, #1a1a1a 100%)';
    localStorage.removeItem('dreados_bg');
}

function toggleTheme() {
    const tb = document.getElementById('taskbar');
    const checked = document.getElementById('themeToggle').checked;
    tb.style.background = checked
        ? 'rgba(230, 225, 215, 0.95)'
        : 'rgba(20, 20, 22, 0.92)';
    tb.style.color = checked ? '#333' : '#ccc';
    tb.querySelectorAll('.taskbar-app, #startBtn').forEach(el => {
        el.style.color = checked ? '#333' : '#ccc';
        el.style.background = checked ? '#e8e4dc' : '#2a2a2e';
    });
    document.getElementById('clock').style.color = checked ? '#333' : '#ccc';
}

function updateAppCount() {
    const el = document.getElementById('openAppCount');
    if (el) el.textContent = Object.keys(openWindows).length;
}

// ---- NOTEPAD ----
function openNotepad() {
    const saved = localStorage.getItem('dreados_notepad') || '';
    const content = `<textarea class="notepad-textarea" id="notepadArea" placeholder="Start typing...">${saved}</textarea>`;
    createWindow('notepad', 'Notepad', 480, 360, content);
    setTimeout(() => {
        const ta = document.getElementById('notepadArea');
        ta.addEventListener('input', () => {
            localStorage.setItem('dreados_notepad', ta.value);
        });
    }, 50);
}

// ---- CALCULATOR ----
function openCalculator() {
    const content = `
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-grid">
            <button onclick="calcClear()">C</button>
            <button onclick="calcDel()">⌫</button>
            <button class="op" onclick="calcOp('%')">%</button>
            <button class="op" onclick="calcOp('/')">/</button>
            <button onclick="calcNum('7')">7</button>
            <button onclick="calcNum('8')">8</button>
            <button onclick="calcNum('9')">9</button>
            <button class="op" onclick="calcOp('*')">×</button>
            <button onclick="calcNum('4')">4</button>
            <button onclick="calcNum('5')">5</button>
            <button onclick="calcNum('6')">6</button>
            <button class="op" onclick="calcOp('-')">−</button>
            <button onclick="calcNum('1')">1</button>
            <button onclick="calcNum('2')">2</button>
            <button onclick="calcNum('3')">3</button>
            <button class="op" onclick="calcOp('+')">+</button>
            <button onclick="calcNum('0')" style="grid-column: span 2;">0</button>
            <button onclick="calcNum('.')">.</button>
            <button class="eq" onclick="calcEq()">=</button>
        </div>`;
    createWindow('calculator', 'Calculator', 320, 440, content);
}

let calcExpr = '';
function calcNum(n) { calcExpr += n; document.getElementById('calcDisplay').textContent = calcExpr; }
function calcOp(o) { calcExpr += o; document.getElementById('calcDisplay').textContent = calcExpr; }
function calcClear() { calcExpr = ''; document.getElementById('calcDisplay').textContent = '0'; }
function calcDel() { calcExpr = calcExpr.slice(0, -1); document.getElementById('calcDisplay').textContent = calcExpr || '0'; }
function calcEq() {
    try {
        const result = Function('"use strict";return (' + calcExpr + ')')();
        document.getElementById('calcDisplay').textContent = result;
        calcExpr = String(result);
    } catch {
        document.getElementById('calcDisplay').textContent = 'Error';
        calcExpr = '';
    }
}

// ---- ABOUT ----
function openAbout() {
    const content = `
        <div style="text-align:center;padding:10px;">
            <div style="font-size:1.6rem;font-weight:600;color:#fff;margin-bottom:6px;">dreadOS</div>
            <div style="color:#888;font-size:0.8rem;margin-bottom:20px;">version 1.0 — browser edition</div>
            <p style="color:#aaa;font-size:0.85rem;line-height:1.6;text-align:left;">
                dreadOS is a tiny desktop environment that runs entirely in your browser.
                No backend, no installs, no tracking.<br><br>
                <b>Apps included:</b> Terminal, Chrome, Settings, Notepad, Calculator.<br><br>
                Built by dread. Inspired by AnuraOS.
            </p>
        </div>`;
    createWindow('about', 'About DreadOS', 400, 320, content);
}

// Update app count whenever windows change
const origCreate = createWindow;
createWindow = function(...args) {
    const r = origCreate.apply(this, args);
    updateAppCount();
    return r;
};
const origClose = closeWindow;
closeWindow = function(...args) {
    const r = origClose.apply(this, args);
    updateAppCount();
    return r;
};
</script>

</body>
</html>
