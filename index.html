<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dreadOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;color:#e0e0e0;user-select:none;-webkit-font-smoothing:antialiased}

/* BOOT */
#boot{position:fixed;inset:0;background:#05050a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s cubic-bezier(.4,0,.2,1),visibility .9s}
#boot.hidden{opacity:0;visibility:hidden;pointer-events:none}
.boot-logo{font-size:2.8rem;font-weight:200;letter-spacing:10px;color:#fff;margin-bottom:6px}
.boot-sub{font-size:.7rem;color:#444;letter-spacing:4px;margin-bottom:44px}
.boot-bar{width:260px;height:2px;background:#15151e;border-radius:2px;overflow:hidden}
.boot-fill{height:100%;width:0;background:linear-gradient(90deg,#a04bd4,#4a7c59,#7ab8ff);transition:width .3s cubic-bezier(.4,0,.2,1)}
.boot-status{font-size:.68rem;color:#333;margin-top:16px;font-family:'Courier New',monospace;letter-spacing:1px}

/* DESKTOP */
#desktop{position:absolute;inset:0;overflow:hidden;
    background:
        radial-gradient(ellipse 60% 80% at 15% 40%, rgba(160,75,212,.55), transparent 60%),
        radial-gradient(ellipse 50% 70% at 5% 80%, rgba(220,120,180,.45), transparent 60%),
        radial-gradient(ellipse 55% 65% at 30% 15%, rgba(90,60,180,.55), transparent 60%),
        radial-gradient(ellipse 45% 55% at 85% 20%, rgba(30,40,90,.7), transparent 65%),
        radial-gradient(ellipse 60% 80% at 90% 85%, rgba(20,25,60,.85), transparent 65%),
        linear-gradient(110deg,#1a0f2e 0%,#12082a 25%,#0a0a1e 55%,#05050d 85%);
    background-size:200% 200%;animation:bgShift 30s ease infinite}
#desktop.wallpaper{animation:none;background-size:cover;background-position:center}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#desktop::before{content:"";position:absolute;inset:-20%;pointer-events:none;
    background:radial-gradient(circle at 25% 55%,rgba(200,120,220,.25),transparent 35%),
               radial-gradient(circle at 45% 75%,rgba(120,60,200,.20),transparent 40%);
    filter:blur(40px);animation:blobMove 22s ease-in-out infinite alternate}
@keyframes blobMove{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(6%,-4%,0) scale(1.08)}}

/* TOPBAR */
#topbar{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(10,10,18,.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;padding:0 12px;gap:14px;font-size:.7rem;color:#aaa;z-index:900}
#topbar .brand{font-weight:600;color:#fff;letter-spacing:1.5px;font-size:.72rem}
#topbar .spacer{flex:1}
#topbar .tray{display:flex;gap:12px;align-items:center;color:#999;font-size:.68rem}
#topbar .chip{background:rgba(255,255,255,.06);padding:3px 9px;border-radius:10px;font-size:.65rem}

/* DOCK */
#dock{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(15,15,25,.55);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:8px 12px;display:flex;gap:6px;z-index:900;box-shadow:0 12px 45px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05)}
.dock-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.04);transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .2s ease;position:relative}
.dock-icon:hover{transform:translate3d(0,-9px,0) scale(1.1);background:rgba(255,255,255,.14)}
.dock-icon::after{content:attr(data-label);position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:.6rem;color:#ddd;background:rgba(0,0,0,.85);padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .18s ease}
.dock-icon:hover::after{opacity:1}
.dock-sep{width:1px;background:rgba(255,255,255,.08);margin:6px 3px}
.dock-indicator{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s ease}
.dock-icon.has-window .dock-indicator{opacity:.7}

/* WINDOWS */
.window{position:absolute;background:rgba(18,18,26,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.7);display:flex;flex-direction:column;min-width:280px;min-height:180px;opacity:0;transform:translate3d(0,12px,0) scale(.94);
    transition:opacity .28s cubic-bezier(.4,0,.2,1),
               transform .32s cubic-bezier(.34,1.4,.64,1),
               width .28s cubic-bezier(.4,0,.2,1),
               height .28s cubic-bezier(.4,0,.2,1),
               left .28s cubic-bezier(.4,0,.2,1),
               top .28s cubic-bezier(.4,0,.2,1)}
/* When dragging, kill transitions on left/top so it's instant */
.window.dragging{transition:opacity .28s cubic-bezier(.4,0,.2,1),
                            transform .32s cubic-bezier(.34,1.4,.64,1),
                            width .28s cubic-bezier(.4,0,.2,1),
                            height .28s cubic-bezier(.4,0,.2,1)}
.window.open{opacity:1;transform:translate3d(0,0,0) scale(1)}
.window.closing{opacity:0;transform:translate3d(0,8px,0) scale(.93)}
.window.minimizing{opacity:0;transform:translate3d(0,400px,0) scale(.15);transition:opacity .28s ease,transform .34s cubic-bezier(.5,0,.7,.4)}
.window.fullscreen{border-radius:0;left:0 !important;top:30px !important;width:100vw !important;height:calc(100vh - 30px) !important}
.window.fullscreen .window-header{cursor:default}
.window-header{height:34px;background:rgba(255,255,255,.03);display:flex;align-items:center;padding:0 12px;gap:10px;cursor:grab;user-select:none;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;touch-action:none}
.window-header:active{cursor:grabbing}
.window.fullscreen .window-header:active{cursor:default}
.window-dots{display:flex;gap:8px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;cursor:pointer;position:relative;transition:filter .15s ease,transform .15s cubic-bezier(.34,1.56,.64,1)}
.dot::before{content:"";position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:rgba(0,0,0,.55);line-height:12px;text-align:center;opacity:0;transition:opacity .12s ease}
.window-header:hover .dot::before{opacity:1}
.dot.red{background:#ff5f57}.dot.red::before{content:"✕"}
.dot.yellow{background:#febc2e}.dot.yellow::before{content:"−"}
.dot.green{background:#28c840}.dot.green::before{content:"+";font-size:10px}
.dot:hover{filter:brightness(1.2)}.dot:active{transform:scale(.9)}
.window-title{flex:1;font-size:.74rem;color:#ccc;font-weight:500;letter-spacing:.3px;text-align:center}
.window-menu{font-size:.85rem;color:#888;cursor:pointer;padding:2px 6px;border-radius:4px}
.window-menu:hover{background:rgba(255,255,255,.08);color:#ccc}
.window-body{flex:1;overflow:auto;position:relative;background:transparent}
.window-body::-webkit-scrollbar{width:8px;height:8px}
.window-body::-webkit-scrollbar-thumb{background:#2a2a35;border-radius:4px}

/* TERMINAL */
.terminal{background:rgba(6,6,10,.96);color:#c8c8c8;font-family:'Menlo','Courier New',monospace;padding:14px;height:100%;overflow-y:auto;font-size:.76rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.terminal::-webkit-scrollbar{width:6px}.terminal::-webkit-scrollbar-thumb{background:#252530;border-radius:3px}
.term-input{background:transparent;border:none;color:#c8c8c8;font-family:inherit;font-size:.76rem;outline:none;width:70%;caret-color:#c8c8c8}
.term-user{color:#7ab8ff}.term-host{color:#a04bd4}.term-path{color:#4a7c59}.term-err{color:#ff5f57}.term-ok{color:#4a7c59}

/* SETTINGS */
.settings-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.06)}
.settings-section:last-child{border-bottom:none;margin-bottom:0}
.settings-label{font-size:.66rem;color:#777;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.settings-btn{background:rgba(255,255,255,.06);color:#ddd;border:1px solid rgba(255,255,255,.08);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:.76rem;transition:background .15s ease,transform .1s ease}
.settings-btn:hover{background:rgba(255,255,255,.12)}.settings-btn:active{transform:scale(.97)}
.settings-btn.danger{background:rgba(200,60,60,.2);border-color:rgba(200,60,60,.3)}
.settings-btn.danger:hover{background:rgba(200,60,60,.35)}
.switch{position:relative;display:inline-block;width:42px;height:22px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#333;transition:.25s;border-radius:22px}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#ccc;transition:.25s cubic-bezier(.4,0,.2,1);border-radius:50%}
input:checked + .slider{background:#4a7c59}
input:checked + .slider:before{transform:translateX(20px)}

.app-iframe{width:100%;height:100%;border:none;background:#fff;display:block}

/* GITHUB */
.gh-container{padding:0;height:100%;overflow-y:auto;background:#0d1117;color:#c9d1d9;font-size:.78rem}
.gh-topbar{padding:10px 16px;background:#010409;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.gh-topbar .url{flex:1;background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:5px 10px;color:#8b949e;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-topbar .gh-btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:.72rem}
.gh-topbar .gh-btn:hover{background:#30363d}
.gh-content{padding:20px 24px}
.gh-repo-title{font-size:1rem;margin-bottom:12px}
.gh-repo-title .owner{color:#58a6ff}.gh-repo-title .name{color:#58a6ff;font-weight:600}
.gh-badge{font-size:.65rem;padding:1px 7px;border:1px solid #30363d;border-radius:20px;color:#8b949e;margin-left:6px}
.gh-tabs{display:flex;gap:14px;border-bottom:1px solid #21262d;margin-bottom:16px;font-size:.76rem}
.gh-tabs div{padding:8px 0;color:#8b949e;cursor:pointer}
.gh-tabs div.active{color:#c9d1d9;border-bottom:2px solid #f78166;margin-bottom:-1px}
.gh-file-row{padding:7px 0;border-bottom:1px solid #161b22;display:flex;gap:10px;align-items:center;font-size:.76rem}
.gh-file-row .icon{color:#8b949e}.gh-file-row .name{color:#58a6ff;cursor:pointer}
.gh-file-row .msg{color:#8b949e;flex:1}.gh-file-row .time{color:#6e7681;font-size:.7rem}
.gh-readme{margin-top:20px;padding:16px;border:1px solid #21262d;border-radius:6px;background:#0d1117}
.gh-readme h2{font-size:.95rem;margin-bottom:8px;border-bottom:1px solid #21262d;padding-bottom:6px}
.gh-readme p{color:#8b949e;font-size:.75rem;line-height:1.6;margin-bottom:8px}

/* DOOM */
.doom-container{width:100%;height:100%;background:#000;position:relative;overflow:hidden}
.doom-placeholder{position:absolute;inset:0;
    background:linear-gradient(180deg,#3a2a1a 0%,#1a0f08 40%,#0a0503 100%),
               radial-gradient(circle at 50% 60%,rgba(180,100,30,.3),transparent 50%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#c9a86a;text-align:center;padding:20px}
.doom-placeholder::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.25) 3px 4px),repeating-linear-gradient(90deg,transparent 0 40px,rgba(80,40,10,.15) 40px 42px);pointer-events:none}
.doom-hud{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#3a1a1a,#1a0808);border-top:2px solid #6a3a1a;display:flex;justify-content:space-between;padding:8px 14px;font-family:'Courier New',monospace;font-size:.75rem;color:#e0c090;z-index:2}
.doom-hud .stat{display:flex;gap:6px;align-items:center}
.doom-hud .stat .val{color:#fff;font-weight:700;font-size:.95rem}
.doom-info{font-size:.7rem;color:#8a6a3a;margin-top:8px;letter-spacing:2px;text-transform:uppercase}

/* CONTEXT MENU */
#contextMenu{position:absolute;background:rgba(18,18,28,.97);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:6px;display:none;z-index:2000;min-width:190px;box-shadow:0 14px 40px rgba(0,0,0,.7);opacity:0;transform:scale(.96);transition:opacity .12s ease,transform .12s cubic-bezier(.34,1.4,.64,1)}
#contextMenu.open{display:block;opacity:1;transform:scale(1)}
.ctx-item{padding:9px 14px;border-radius:6px;cursor:pointer;font-size:.76rem;color:#ddd;transition:background .12s}
.ctx-item:hover{background:rgba(255,255,255,.09)}

.notepad-textarea{width:100%;height:100%;background:rgba(12,12,18,.7);color:#ddd;border:none;outline:none;resize:none;padding:14px;font-family:'Courier New',monospace;font-size:.8rem;line-height:1.5}
.calc-display{background:rgba(0,0,0,.45);color:#fff;padding:16px;text-align:right;font-size:1.55rem;border-radius:8px;margin-bottom:10px;min-height:2em;word-wrap:break-word;font-weight:300;letter-spacing:1px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-grid button{padding:14px 0;background:rgba(255,255,255,.06);color:#ddd;border:1px solid rgba(255,255,255,.05);border-radius:8px;cursor:pointer;font-size:1rem;transition:background .12s ease,transform .08s ease}
.calc-grid button:hover{background:rgba(255,255,255,.12)}.calc-grid button:active{transform:scale(.96)}
.calc-grid button.op{color:#7ab8ff}
.calc-grid button.eq{background:linear-gradient(135deg,#4a7c59,#3a6c49);color:#fff}

.masked-url{flex:1;padding:6px 12px;background:rgba(0,0,0,.35);border-radius:6px;font-size:.72rem;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Menlo','Courier New',monospace;letter-spacing:1.5px}

/* GAME WINDOWS */
.game-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a12;color:#ddd;padding:12px;gap:10px}
.game-hud{display:flex;gap:16px;font-size:.75rem;color:#999;font-family:'Menlo','Courier New',monospace}
.game-hud b{color:#7ab8ff;font-weight:600}
.game-canvas{background:#050510;border:1px solid #2a2a35;border-radius:6px;display:block;max-width:100%}
.game-btn{background:rgba(255,255,255,.06);color:#ddd;border:1px solid rgba(255,255,255,.1);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:background .15s}
.game-btn:hover{background:rgba(255,255,255,.14)}
.game-help{font-size:.7rem;color:#666;text-align:center;font-family:'Menlo',monospace}

/* MEMORY */
.memory-grid{display:grid;grid-template-columns:repeat(4,64px);gap:8px}
.mem-card{width:64px;height:64px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.6rem;transition:background .15s,transform .15s;color:transparent}
.mem-card.flipped{background:rgba(74,124,89,.25);color:#fff;border-color:rgba(74,124,89,.6)}
.mem-card.matched{background:rgba(122,184,255,.15);color:#fff;border-color:rgba(122,184,255,.5);cursor:default}

/* TIC TAC TOE */
.ttt-grid{display:grid;grid-template-columns:repeat(3,80px);grid-template-rows:repeat(3,80px);gap:6px}
.ttt-cell{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:300;color:#7ab8ff;transition:background .15s}
.ttt-cell:hover:empty{background:rgba(255,255,255,.1)}
.ttt-cell.x{color:#7ab8ff}.ttt-cell.o{color:#ff9d5c}
</style>
</head>
<body>

<div id="boot">
    <div class="boot-logo">dreadOS</div>
    <div class="boot-sub">VERSION 1.0</div>
    <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
    <div class="boot-status" id="bootStatus">initializing...</div>
</div>

<div id="desktop"></div>

<div id="topbar">
    <span class="brand">dreadOS</span>
    <span class="spacer"></span>
    <div class="tray">
        <span class="chip" id="trayBattery">100%</span>
        <span class="chip" id="trayWifi">wifi</span>
        <span id="trayDate"></span>
        <span id="trayClock">--:--</span>
    </div>
</div>

<div id="dock">
    <div class="dock-icon" data-app="terminal" data-label="Terminal" onclick="openApp('terminal')">▣<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="chrome" data-label="Chrome" onclick="openApp('chrome')">◐<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="settings" data-label="Files" onclick="openApp('settings')">▤<span class="dock-indicator"></span></div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-app="github" data-label="GitHub" onclick="openApp('github')">◉<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="doom" data-label="DOOM" onclick="openApp('doom')">☠<span class="dock-indicator"></span></div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-app="settings" data-label="Settings" onclick="openApp('settings')">⚙<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="notepad" data-label="Notepad" onclick="openApp('notepad')">✎<span class="dock-indicator"></span></div>
    <div class="dock-icon" data-app="calculator" data-label="Calculator" onclick="openApp('calculator')">±<span class="dock-indicator"></span></div>
</div>

<div id="contextMenu">
    <div class="ctx-item" onclick="openApp('terminal')">Open Terminal</div>
    <div class="ctx-item" onclick="openApp('github')">Open GitHub</div>
    <div class="ctx-item" onclick="openApp('doom')">Open DOOM</div>
    <div class="ctx-item" onclick="openApp('settings')">Change Wallpaper</div>
    <div class="ctx-item" onclick="closeAllWindows()">Close All Windows</div>
</div>

<script>
/* BOOT */
const bootSteps=[[12,"loading kernel modules..."],[28,"initializing display server..."],[46,"mounting virtual filesystem..."],[64,"starting window manager..."],[80,"loading user profile..."],[94,"applying wallpaper..."],[100,"welcome, dread."]];
let bi=0;
(function runBoot(){
    if(bi>=bootSteps.length){
        setTimeout(()=>{document.getElementById('boot').classList.add('hidden');setTimeout(()=>openApp('terminal'),400);},500);
        return;
    }
    const [p,m]=bootSteps[bi++];
    document.getElementById('bootFill').style.width=p+'%';
    document.getElementById('bootStatus').textContent=m;
    setTimeout(runBoot,340);
})();

/* DESKTOP */
const desktop=document.getElementById('desktop');
const savedBg=localStorage.getItem('dreados_bg');
if(savedBg){desktop.classList.add('wallpaper');desktop.style.backgroundImage=`url(${savedBg})`}

/* CLOCK */
function updateClock(){const d=new Date();
    document.getElementById('trayClock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    document.getElementById('trayDate').textContent=d.toLocaleDateString([],{month:'short',day:'numeric'});}
setInterval(updateClock,1000);updateClock();
if(navigator.getBattery){navigator.getBattery().then(b=>{const u=()=>document.getElementById('trayBattery').textContent=Math.round(b.level*100)+'%';u();b.addEventListener('levelchange',u);});}
else{document.getElementById('trayBattery').style.display='none';}
document.getElementById('trayWifi').textContent=navigator.onLine?'wifi':'offline';

/* WINDOW MANAGER */
let zTop=100;
const windows={};
const minimized={};

function createWindow(id,title,w,h,bodyHTML,appName){
    if(windows[id]){
        if(minimized[id]){const el=windows[id].el;el.style.visibility='';el.classList.remove('minimizing');minimized[id]=false;}
        focusWin(id);return;
    }
    const win=document.createElement('div');
    win.className='window';win.id='win-'+id;
    const off=Object.keys(windows).length*28;
    win.style.left=(Math.max(30,(window.innerWidth-w)/2+off-70))+'px';
    win.style.top=(Math.max(40,(window.innerHeight-h)/2+off-50))+'px';
    win.style.width=w+'px';win.style.height=h+'px';
    win.style.zIndex=++zTop;
    win.innerHTML=`
        <div class="window-header">
            <div class="window-dots">
                <div class="dot red"    onclick="event.stopPropagation();closeWin('${id}')"     title="Close"></div>
                <div class="dot yellow" onclick="event.stopPropagation();minimizeWin('${id}')"  title="Minimize"></div>
                <div class="dot green"  onclick="event.stopPropagation();toggleFullscreen('${id}')" title="Fullscreen"></div>
            </div>
            <div class="window-title">${title}</div>
            <div class="window-menu" onclick="event.stopPropagation();">⋯</div>
        </div>
        <div class="window-body" id="body-${id}">${bodyHTML}</div>`;
    document.body.appendChild(win);
    requestAnimationFrame(()=>win.classList.add('open'));

    /* ==== FAST DRAG using Pointer Events + capture ==== */
    const header=win.querySelector('.window-header');
    let drag=false, sx=0, sy=0, sl=0, st=0, pid=null;
    header.addEventListener('pointerdown', e=>{
        if(e.target.classList.contains('dot')||e.target.classList.contains('window-menu'))return;
        if(win.classList.contains('fullscreen'))return;
        drag=true; pid=e.pointerId;
        sx=e.clientX; sy=e.clientY;
        sl=win.offsetLeft; st=win.offsetTop;
        win.classList.add('dragging');
        header.setPointerCapture(pid);
        focusWin(id);
        e.preventDefault();
    });
    header.addEventListener('pointermove', e=>{
        if(!drag||e.pointerId!==pid)return;
        // use transform for the smoothest possible movement — but since window uses left/top,
        // we set left/top directly with transitions disabled
        win.style.left=(sl+e.clientX-sx)+'px';
        win.style.top =(st+e.clientY-sy)+'px';
    });
    function endDrag(e){
        if(!drag)return;
        drag=false;
        try{header.releasePointerCapture(pid);}catch(_){}
        pid=null;
        win.classList.remove('dragging');
    }
    header.addEventListener('pointerup', endDrag);
    header.addEventListener('pointercancel', endDrag);
    win.addEventListener('mousedown',()=>focusWin(id));

    windows[id]={el:win,app:appName||id};
    updateDockIndicators();updateWinCount();
    return win;
}
function focusWin(id){const w=windows[id];if(!w)return;
    if(minimized[id]){w.el.style.visibility='';w.el.classList.remove('minimizing');minimized[id]=false;}
    w.el.style.zIndex=++zTop;updateDockIndicators();}
function closeWin(id){const w=windows[id];if(!w)return;
    w.el.classList.add('closing');
    setTimeout(()=>{w.el.remove();delete windows[id];delete minimized[id];updateDockIndicators();updateWinCount();},220);
    updateWinCount();}
function minimizeWin(id){const w=windows[id];if(!w)return;
    w.el.classList.add('minimizing');minimized[id]=true;
    setTimeout(()=>{if(windows[id])w.el.style.visibility='hidden';},340);}
function toggleFullscreen(id){const w=windows[id];if(!w)return;
    const isFull=w.el.classList.contains('fullscreen');
    if(isFull){w.el.classList.remove('fullscreen');
        if(w.el.dataset.prev){const p=JSON.parse(w.el.dataset.prev);
            w.el.style.left=p.left;w.el.style.top=p.top;w.el.style.width=p.width;w.el.style.height=p.height;}}
    else{w.el.dataset.prev=JSON.stringify({left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height});
        w.el.classList.add('fullscreen');}
    focusWin(id);}
function closeAllWindows(){Object.keys(windows).forEach(closeWin);}
function updateDockIndicators(){document.querySelectorAll('.dock-icon').forEach(ic=>{
    const app=ic.dataset.app;
    const hasOpen=Object.values(windows).some(w=>w.app===app);
    ic.classList.toggle('has-window',hasOpen);});}
function updateWinCount(){const el=document.getElementById('winCount');if(el)el.textContent=Object.keys(windows).length;}

function printTerm(html){

function handleCmd(cmd){
    printTerm(`<span class="term-user">dread</span><span style="color:#666">@</span><span class="term-host">dreados</span><span class="term-path">:~$</span> ${cmd}`);
    const c=cmd.toLowerCase().trim();

        printTerm('  open doom     — launch doom');
        printTerm('  open github   — launch github view');
        printTerm('  open settings — launch settings');
        printTerm('  open notepad  — launch notepad');
        printTerm('<span class="term-ok">Games:</span>');
        printTerm('  play snake     — classic snake game');
        printTerm('  play tictactoe — tic tac toe vs AI');
        printTerm('  play pong      — pong vs AI');

    }
    else if(c==='specs'||c==='neofetch'){printSpecs();}
    else if(c==='date'){printTerm(new Date().toString());}
    else if(c==='whoami'){printTerm('dread');}
    else if(c.startsWith('echo ')){printTerm(cmd.substring(5));}
    else if(c==='open chrome'){openChrome();printTerm('launching chrome...');}
    else if(c==='open doom'){openDoom();printTerm('launching doom...');}
    else if(c==='open github'){openGithub();printTerm('launching github view...');}
    else if(c==='open settings'){openSettings();printTerm('launching settings...');}
    else if(c==='open notepad'){openNotepad();printTerm('launching notepad...');}

    else if(c==='play pong'||c==='pong'){printTerm('<span class="term-ok">launching pong...</span>');openApp('pong');}
    else if(c==='play memory'||c==='memory'){printTerm('<span class="term-ok">launching memory...</span>');openApp('memory');}
    else if(c==='play breakout'||c==='breakout'){printTerm('<span class="term-ok">launching breakout...</span>');openApp('breakout');}
    else if(cmd===''){}
    else{printTerm(`<span class="term-err">unknown command: ${cmd}</span> — type "help"`);}
}

/* ---------- SNAKE ---------- */
function startSnake(){
    const html=`
        <div class="game-wrap">
            <div class="game-hud">SCORE <b id="snakeScore">0</b> BEST <b id="snakeBest">${localStorage.getItem('snakeBest')||0}</b></div>
            <canvas id="snakeCanvas" class="game-canvas" width="360" height="360"></canvas>
            <button class="game-btn" onclick="snakeReset()">New Game</button>
            <div class="game-help">Arrow keys / WASD to move — Space to pause</div>
        </div>`;
    createWindow('snake','Snake',400,500,html,'snake');
    setTimeout(()=>snakeInit(),50);
}
let snake=null;
function snakeInit(){
    const canvas=document.getElementById('snakeCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const size=18, tiles=20;
    function reset(){
        snake={x:10,y:10,dx:1,dy:0,cells:[{x:10,y:10}],food:randFood(),score:0,paused:false,dead:false};
        document.getElementById('snakeScore').textContent=0;
    }
    function randFood(){
        return {x:Math.floor(Math.random()*tiles),y:Math.floor(Math.random()*tiles)};
    }
    function draw(){
        ctx.fillStyle='#050510';ctx.fillRect(0,0,canvas.width,canvas.height);
        // grid
        ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
        for(let i=0;i<=tiles;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,tiles*size);ctx.stroke();
            ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(tiles*size,i*size);ctx.stroke();}
        // food
        ctx.fillStyle='#ff5f57';
        ctx.beginPath();ctx.arc(snake.food.x*size+size/2,snake.food.y*size+size/2,size/2-2,0,Math.PI*2);ctx.fill();
        // snake
        snake.cells.forEach((c,i)=>{
            ctx.fillStyle=i===0?'#7ab8ff':'#4a7c59';
            ctx.fillRect(c.x*size+1,c.y*size+1,size-2,size-2);
        });
        if(snake.paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('PAUSED',canvas.width/2,canvas.height/2);}
        if(snake.dead){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='#ff5f57';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-10);
            ctx.fillStyle='#ccc';ctx.font='14px sans-serif';ctx.fillText('Score: '+snake.score,canvas.width/2,canvas.height/2+20);}
    }
    function step(){
        if(!snake||snake.paused||snake.dead)return;
        const head={x:snake.cells[0].x+snake.dx,y:snake.cells[0].y+snake.dy};
        if(head.x<0||head.x>=tiles||head.y<0||head.y>=tiles||snake.cells.some(c=>c.x===head.x&&c.y===head.y)){
            snake.dead=true;draw();
            const best=parseInt(localStorage.getItem('snakeBest')||0);
            if(snake.score>best){localStorage.setItem('snakeBest',snake.score);document.getElementById('snakeBest').textContent=snake.score;}
            return;
        }
        snake.cells.unshift(head);
        if(head.x===snake.food.x&&head.y===snake.food.y){
            snake.score++;snake.food=randFood();
            document.getElementById('snakeScore').textContent=snake.score;
        } else snake.cells.pop();
        draw();
    }
    window.snakeReset=()=>{reset();draw();};
    window.snakeKey=e=>{
        const k=e.key.toLowerCase();
        if((k==='arrowup'||k==='w')&&snake.dy!==1){snake.dx=0;snake.dy=-1;}
        else if((k==='arrowdown'||k==='s')&&snake.dy!==-1){snake.dx=0;snake.dy=1;}
        else if((k==='arrowleft'||k==='a')&&snake.dx!==1){snake.dx=-1;snake.dy=0;}
        else if((k==='arrowright'||k==='d')&&snake.dx!==-1){snake.dx=1;snake.dy=0;}
        else if(k===' '){snake.paused=!snake.paused;draw();}
        if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
    };
    document.addEventListener('keydown',window.snakeKey);
    reset();draw();
    clearInterval(window._snakeInt);
    window._snakeInt=setInterval(step,100);
}

/* ---------- TIC TAC TOE ---------- */
function startTicTacToe(){
    const html=`
        <div class="game-wrap">
            <div class="game-hud">YOU <b>X</b> — AI <b>O</b> — <span id="tttStatus">Your turn</span></div>
            <div class="ttt-grid" id="tttGrid">
                ${Array.from({length:9}).map((_,i)=>`<div class="ttt-cell" data-i="${i}" onclick="tttClick(${i})"></div>`).join('')}
            </div>
            <button class="game-btn" onclick="tttReset()">New Game</button>
        </div>`;
    createWindow('tictactoe','Tic Tac Toe',330,420,html,'tictactoe');
    setTimeout(()=>tttReset(),50);
}
let tttBoard=null, tttDone=false;
function tttReset(){
    tttBoard=['','','','','','','','',''];
    tttDone=false;
    document.querySelectorAll('#tttGrid .ttt-cell').forEach(c=>{c.textContent='';c.className='ttt-cell';});
    document.getElementById('tttStatus').textContent='Your turn';
}
function tttClick(i){
    if(tttDone||tttBoard[i])return;
    tttBoard[i]='X';
    updateTTT();
    if(checkTTT('X'))return;
    if(tttBoard.every(c=>c))return;
    // AI move after small delay
    document.getElementById('tttStatus').textContent='AI thinking...';
    setTimeout(()=>{
        const move=bestTTTMove();
        if(move!==null){tttBoard[move]='O';updateTTT();
            if(checkTTT('O'))return;
            if(tttBoard.every(c=>c)){document.getElementById('tttStatus').textContent='Draw!';tttDone=true;return;}
        }
        document.getElementById('tttStatus').textContent='Your turn';
    },250);
}
function updateTTT(){
    document.querySelectorAll('#tttGrid .ttt-cell').forEach((c,i)=>{
        c.textContent=tttBoard[i];
        c.className='ttt-cell'+(tttBoard[i]==='X'?' x':tttBoard[i]==='O'?' o':'');
    });
}
function checkTTT(p){
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(const w of wins){
        if(tttBoard[w[0]]===p&&tttBoard[w[1]]===p&&tttBoard[w[2]]===p){
            document.getElementById('tttStatus').textContent=p==='X'?'You win!':'AI wins!';
            tttDone=true;return true;
        }
    }
    return false;
}
function bestTTTMove(){
    // Try win, then block, then center, then corner, then random
    const empty=tttBoard.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(!empty.length)return null;
    for(const p of ['O','X']){
        for(const i of empty){
            const copy=[...tttBoard];copy[i]=p;
            const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            if(wins.some(w=>copy[w[0]]===p&&copy[w[1]]===p&&copy[w[2]]===p))return i;
        }
    }
    if(tttBoard[4]==='')return 4;
    const corners=[0,2,6,8].filter(i=>tttBoard[i]==='');
    if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
    return empty[Math.floor(Math.random()*empty.length)];
}

/* ---------- PONG ---------- */
function startPong(){
    const html=`
        <div class="game-wrap">
            <div class="game-hud">YOU <b id="pongYou">0</b> — AI <b id="pongAi">0</b></div>
            <canvas id="pongCanvas" class="game-canvas" width="480" height="320"></canvas>
            <button class="game-btn" onclick="pongReset()">New Game</button>
            <div class="game-help">Mouse or ↑/↓ to move your paddle</div>
        </div>`;
    createWindow('pong','Pong',520,460,html,'pong');
    setTimeout(()=>pongInit(),50);
}
let pong=null;
function pongInit(){
    const canvas=document.getElementById('pongCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const W=canvas.width,H=canvas.height;
    const PH=70,PW=10;
    function reset(){
        pong={
            player:{y:H/2-PH/2,x:20,w:PW,h:PH},
            ai:{y:H/2-PH/2,x:W-30,w:PW,h:PH},
            ball:{x:W/2,y:H/2,dx:4,dy:2,r:6},
            you:0,ai:0,over:false
        };
        document.getElementById('pongYou').textContent=0;
        document.getElementById('pongAi').textContent=0;
    }
    function draw(){
        ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
        ctx.strokeStyle='rgba(255,255,255,.15)';ctx.setLineDash([6,6]);
        ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#7ab8ff';ctx.fillRect(pong.player.x,pong.player.y,pong.player.w,pong.player.h);
        ctx.fillStyle='#ff5f57';ctx.fillRect(pong.ai.x,pong.ai.y,pong.ai.w,pong.ai.h);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pong.ball.x,pong.ball.y,pong.ball.r,0,Math.PI*2);ctx.fill();
        if(pong.over){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
            ctx.fillStyle='#fff';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2);}
    }
    function step(){
        if(!pong||pong.over)return;
        pong.ball.x+=pong.ball.dx;pong.ball.y+=pong.ball.dy;
        if(pong.ball.y<0||pong.ball.y>H){pong.ball.dy*=-1;}
        // paddle collide
        if(pong.ball.x-pong.ball.r<pong.player.x+pong.player.w&&
           pong.ball.y>pong.player.y&&pong.ball.y<pong.player.y+pong.player.h&&pong.ball.dx<0){
            pong.ball.dx*=-1;pong.ball.dx*=1.05;
        }
        if(pong.ball.x+pong.ball.r>pong.ai.x&&
           pong.ball.y>pong.ai.y&&pong.ball.y<pong.ai.y+pong.ai.h&&pong.ball.dx>0){
            pong.ball.dx*=-1;pong.ball.dx*=1.05;
        }
        // scoring
        if(pong.ball.x<0){pong.ai++;document.getElementById('pongAi').textContent=pong.ai;
            if(pong.ai>=5){pong.over=true;}else{pong.ball.x=W/2;pong.ball.y=H/2;pong.ball.dx=4;pong.ball.dy=2;}}
        if(pong.ball.x>W){pong.you++;document.getElementById('pongYou').textContent=pong.you;
            if(pong.you>=5){pong.over=true;}else{pong.ball.x=W/2;pong.ball.y=H/2;pong.ball.dx=-4;pong.ball.dy=-2;}}
        // AI follows
        const target=pong.ball.y-PH/2;
        pong.ai.y+=Math.max(-4,Math.min(4,(target-pong.ai.y)*0.08));
        draw();
    }
    window.pongReset=()=>reset();
    window.pongKey=e=>{
        const k=e.key;
        if(k==='ArrowUp'){pong.player.y=Math.max(0,pong.player.y-20);e.preventDefault();}
        if(k==='ArrowDown'){pong.player.y=Math.min(H-PH,pong.player.y+20);e.preventDefault();}
    };
    canvas.addEventListener('mousemove',e=>{
        const r=canvas.getBoundingClientRect();
        pong.player.y=Math.max(0,Math.min(H-PH,(e.clientY-r.top)-PH/2));
    });
    document.addEventListener('keydown',window.pongKey);
    reset();
    clearInterval(window._pongInt);
    window._pongInt=setInterval(step,1000/60);
}

/* ---------- MEMORY MATCH ---------- */
function startMemory(){
    const html=`
        <div class="game-wrap">
            <div class="game-hud">MOVES <b id="memMoves">0</b> MATCHES <b id="memMatches">0</b>/8</div>
            <div class="memory-grid" id="memGrid"></div>
            <button class="game-btn" onclick="memReset()">New Game</button>
        </div>`;
    createWindow('memory','Memory Match',340,440,html,'memory');
    setTimeout(()=>memReset(),50);
}
let memState=null;
function memReset(){
    const emojis=['🍎','🍌','🍇','🍒','🥝','🍑','🍍','🥥'];
    const deck=[...emojis,...emojis].sort(()=>Math.random()-0.5);
    memState={deck,flipped:[],matched:new Set(),moves:0,lock:false};
    document.getElementById('memMoves').textContent=0;
    document.getElementById('memMatches').textContent=0;
    renderMem();
}
function renderMem(){
    const grid=document.getElementById('memGrid');if(!grid)return;
    grid.innerHTML=memState.deck.map((e,i)=>{
        const isFlipped=memState.flipped.includes(i)||memState.matched.has(i);
        const cls='mem-card'+(isFlipped?' flipped':'')+(memState.matched.has(i)?' matched':'');
        return `<div class="${cls}" onclick="memClick(${i})">${isFlipped?e:''}</div>`;
    }).join('');
}
function memClick(i){
    if(!memState||memState.lock)return;
    if(memState.flipped.includes(i)||memState.matched.has(i))return;
    memState.flipped.push(i);
    renderMem();
    if(memState.flipped.length===2){
        memState.moves++;
        document.getElementById('memMoves').textContent=memState.moves;
        const [a,b]=memState.flipped;
        if(memState.deck[a]===memState.deck[b]){
            memState.matched.add(a);memState.matched.add(b);
            memState.flipped=[];
            document.getElementById('memMatches').textContent=memState.matched.size/2;
            renderMem();
        } else {
            memState.lock=true;
            setTimeout(()=>{memState.flipped=[];memState.lock=false;renderMem();},700);
        }
    }
}

/* ---------- BREAKOUT ---------- */
function startBreakout(){
    const html=`
        <div class="game-wrap">
            <div class="game-hud">SCORE <b id="brScore">0</b> LIVES <b id="brLives">3</b></div>
            <canvas id="brCanvas" class="game-canvas" width="480" height="360"></canvas>
            <button class="game-btn" onclick="brReset()">New Game</button>
            <div class="game-help">Mouse or ←/→ to move paddle</div>
        </div>`;
    createWindow('breakout','Breakout',520,500,html,'breakout');
    setTimeout(()=>brInit(),50);
}
let br=null;
function brInit(){
    const canvas=document.getElementById('brCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const W=canvas.width,H=canvas.height;
    const PW=90,PH=12,BR=8,BC=9;
    function reset(){
        br={
            paddle:{x:W/2-PW/2,w:PW,h:PH},
            ball:{x:W/2,y:H-40,dx:3,dy:-3,r:6},
            bricks:Array.from({length:5},(_,r)=>Array.from({length:BC},(_,c)=>({x:c*52+10,y:r*22+30,alive:true,color:['#ff5f57','#febc2e','#7ab8ff','#a04bd4','#4a7c59'][r]}))).flat(),
            score:0,lives:3,over:false
        };
        document.getElementById('brScore').textContent=0;
        document.getElementById('brLives').textContent=3;
    }
    function draw(){
        ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
        br.bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,48,16);}});
        ctx.fillStyle='#7ab8ff';ctx.fillRect(br.paddle.x,H-30,br.paddle.w,br.paddle.h);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(br.ball.x,br.ball.y,br.ball.r,0,Math.PI*2);ctx.fill();
        if(br.over){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
            ctx.fillStyle='#ff5f57';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-10);
            ctx.fillStyle='#ccc';ctx.font='14px sans-serif';ctx.fillText('Score: '+br.score,W/2,H/2+20);}
    }
    function step(){
        if(!br||br.over)return;
        br.ball.x+=br.ball.dx;br.ball.y+=br.ball.dy;
        if(br.ball.x<br.ball.r||br.ball.x>W-br.ball.r)br.ball.dx*=-1;
        if(br.ball.y<br.ball.r)br.ball.dy*=-1;
        // paddle
        if(br.ball.y+br.ball.r>H-30&&br.ball.y<H-30+PH&&
           br.ball.x>br.paddle.x&&br.ball.x<br.paddle.x+br.paddle.w&&br.ball.dy>0){
            br.ball.dy*=-1;
            const hit=(br.ball.x-(br.paddle.x+br.paddle.w/2))/(br.paddle.w/2);
            br.ball.dx=hit*4;
        }
        // bricks
        br.bricks.forEach(b=>{
            if(!b.alive)return;
            if(br.ball.x>b.x&&br.ball.x<b.x+48&&br.ball.y>b.y&&br.ball.y<b.y+16){
                b.alive=false;br.ball.dy*=-1;br.score+=10;
                document.getElementById('brScore').textContent=br.score;
            }
        });
        // lost ball
        if(br.ball.y>H){
            br.lives--;document.getElementById('brLives').textContent=br.lives;
            if(br.lives<=0){br.over=true;} else {br.ball.x=W/2;br.ball.y=H-40;br.ball.dx=3;br.ball.dy=-3;}
        }
        // win
        if(br.bricks.every(b=>!b.alive)){br.over=true;}
        draw();
    }
    window.brReset=()=>reset();
    window.brKey=e=>{
        if(e.key==='ArrowLeft'){br.paddle.x=Math.max(0,br.paddle.x-30);e.preventDefault();}
        if(e.key==='ArrowRight'){br.paddle.x=Math.min(W-PW,br.paddle.x+30);e.preventDefault();}
    };
    canvas.addEventListener('mousemove',e=>{
        const r=canvas.getBoundingClientRect();
        br.paddle.x=Math.max(0,Math.min(W-PW,(e.clientX-r.left)-PW/2));
    });
    document.addEventListener('keydown',window.brKey);
    reset();
    clearInterval(window._brInt);
    window._brInt=setInterval(step,1000/60);
}

document.addEventListener('contextmenu',e=>{
