<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror · Search</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
        --bg-0: #06060a;
        --bg-1: #0b0b12;
        --glass: rgba(255,255,255,0.035);
        --glass-hi: rgba(255,255,255,0.06);
        --border: rgba(255,255,255,0.07);
        --border-hi: rgba(255,255,255,0.12);
        --text: #eaeaf2;
        --text-dim: #8a8aa0;
        --text-mute: #565669;
        --accent: #4a9eff;
        --accent-glow: rgba(74,158,255,0.35);
        --red: #ff5f57;
        --yellow: #febc2e;
        --green: #28c840;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        background: var(--bg-0);
        color: var(--text);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }

    .bg-layer {
        position: fixed; inset: 0; z-index: 0;
        background:
            radial-gradient(ellipse 80% 50% at 20% 0%, rgba(74,158,255,0.10), transparent 60%),
            radial-gradient(ellipse 70% 50% at 80% 100%, rgba(155,77,255,0.08), transparent 60%),
            var(--bg-0);
    }
    .bg-grid {
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent 80%);
        animation: gridDrift 30s linear infinite;
    }
    @keyframes gridDrift {
        0%   { background-position: 0 0, 0 0; }
        100% { background-position: 60px 60px, 60px 60px; }
    }
    .bg-glow {
        position: absolute; width: 500px; height: 500px; border-radius: 50%;
        filter: blur(100px); opacity: 0.4;
        animation: glowFloat 18s ease-in-out infinite alternate;
    }
    .bg-glow.g1 { top: -150px; left: -100px; background: radial-gradient(circle, #4a9eff, transparent 70%); }
    .bg-glow.g2 { bottom: -200px; right: -100px; background: radial-gradient(circle, #9b4dff, transparent 70%); animation-delay: -6s; }
    .bg-glow.g3 { top: 40%; left: 60%; width: 300px; height: 300px; background: radial-gradient(circle, #ff6b35, transparent 70%); opacity: 0.25; animation-delay: -12s; }
    @keyframes glowFloat {
        0%   { transform: translate(0,0) scale(1); }
        100% { transform: translate(50px,30px) scale(1.15); }
    }
    .bg-noise {
        position: absolute; inset: 0; opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        pointer-events: none;
    }

    .splash {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: rgba(6,6,10,0.95);
        backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        transition: opacity 1s ease, transform 1s ease;
    }
    .splash.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }
    .splash-mark {
        font-size: 72px; font-weight: 200; letter-spacing: -3px; color: var(--text);
        opacity: 0; animation: fadeUp 1.4s cubic-bezier(0.2,0.9,0.3,1) 0.2s forwards;
    }
    .splash-mark span { color: var(--accent); font-weight: 500; }
    .splash-quote {
        font-size: 15px; font-weight: 300; color: var(--text-dim);
        max-width: 560px; text-align: center; margin-top: 24px; padding: 0 24px;
        line-height: 1.7; letter-spacing: 0.2px;
        opacity: 0; animation: fadeUp 1.4s cubic-bezier(0.2,0.9,0.3,1) 0.6s forwards;
    }
    .splash-quote .author {
        display: block; margin-top: 12px; font-size: 11px;
        letter-spacing: 3px; text-transform: uppercase; color: var(--text-mute);
    }
    .splash-sub {
        margin-top: 48px; font-size: 10px; letter-spacing: 6px;
        text-transform: uppercase; color: var(--text-mute);
        opacity: 0; animation: fadeUp 1.4s cubic-bezier(0.2,0.9,0.3,1) 1s forwards;
    }
    @keyframes fadeUp {
        0%   { opacity: 0; transform: translateY(16px); filter: blur(6px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .overlay {
        position: fixed; inset: 0; z-index: 900;
        background: rgba(6,6,10,0.85);
        backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        display: none; opacity: 0; transition: opacity 0.7s ease;
        padding: 24px;
    }
    .overlay.show { display: flex; opacity: 1; }
    .overlay-window {
        width: 100%; height: 100%; max-width: 1400px; margin: 0 auto;
        background: var(--bg-1);
        border: 1px solid var(--border); border-radius: 12px;
        box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8);
        display: flex; flex-direction: column; overflow: hidden;
        transform: scale(0.98);
        transition: transform 0.7s cubic-bezier(0.2,0.9,0.3,1);
    }
    .overlay.show .overlay-window { transform: scale(1); }

    .titlebar {
        height: 40px;
        background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; padding: 0 16px; gap: 10px;
        flex-shrink: 0; position: relative;
    }
    .traffic { display: flex; gap: 8px; align-items: center; }
    .tl {
        width: 12px; height: 12px; border-radius: 50%; border: none;
        cursor: pointer; padding: 0;
        display: flex; align-items: center; justify-content: center;
        transition: transform 0.15s ease, filter 0.15s ease;
        box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15);
    }
    .tl:hover { filter: brightness(1.15); transform: scale(1.08); }
    .tl:active { transform: scale(0.92); }
    .tl.r { background: var(--red); }
    .tl.y { background: var(--yellow); }
    .tl.g { background: var(--green); }
    .tl svg { opacity: 0; transition: opacity 0.15s; width: 6px; height: 6px; }
    .traffic:hover .tl svg { opacity: 0.55; }

    .win-title {
        position: absolute; left: 50%; transform: translateX(-50%);
        font-size: 12px; font-weight: 500; color: var(--text-dim);
        letter-spacing: 0.3px; max-width: 60%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        pointer-events: none;
    }
    .win-actions { margin-left: auto; display: flex; gap: 8px; }
    .win-action {
        background: transparent; border: 1px solid var(--border);
        color: var(--text-dim); font-size: 11px; font-family: inherit;
        padding: 4px 12px; border-radius: 6px; cursor: pointer;
        transition: 0.2s; letter-spacing: 0.3px;
    }
    .win-action:hover {
        background: var(--glass-hi); color: var(--text); border-color: var(--border-hi);
    }
    .window-body { flex: 1; position: relative; background: #0a0a0f; }
    .window-body iframe { width: 100%; height: 100%; border: none; display: block; }

    .main {
        position: relative; z-index: 5; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 20px; opacity: 0; transition: opacity 0.8s ease 0.3s;
    }
    .main.on { opacity: 1; }

    .app-window {
        width: 100%; max-width: 820px;
        background: var(--glass);
        backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow:
            0 30px 80px -20px rgba(0,0,0,0.7),
            0 1px 0 0 rgba(255,255,255,0.04) inset;
        overflow: hidden;
        animation: windowIn 0.9s cubic-bezier(0.2,0.9,0.3,1);
        transition: max-width 0.5s cubic-bezier(0.2,0.9,0.3,1);
    }
    @keyframes windowIn {
        0%   { opacity: 0; transform: translateY(20px) scale(0.97); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .app-window.minimized { max-width: 320px; }
    .app-window.minimized .app-body { display: none; }
    .app-window.minimized .app-titlebar { border-bottom: none; }

    .app-titlebar {
        height: 44px;
        background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; padding: 0 18px; gap: 12px;
        position: relative;
    }
    .app-title {
        position: absolute; left: 50%; transform: translateX(-50%);
        font-size: 13px; font-weight: 500; color: var(--text-dim);
        letter-spacing: 0.2px; display: flex; align-items: center; gap: 6px;
    }
    .app-title .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);
    }

    .app-body { padding: 26px 28px 24px; }

    .hero {
        text-align: center;
        margin-bottom: 26px;
    }
    .hero h1 {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: -0.5px;
        color: var(--text);
        margin-bottom: 8px;
    }
    .hero h1 span { color: var(--accent); font-weight: 500; }
    .hero p {
        font-size: 13px;
        color: var(--text-dim);
        letter-spacing: 0.3px;
    }

    .search-wrap {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
    }
    .search-input {
        flex: 1;
        padding: 15px 18px;
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-family: inherit;
        font-size: 14.5px;
        outline: none;
        transition: 0.2s;
        letter-spacing: 0.2px;
    }
    .search-input::placeholder { color: var(--text-mute); }
    .search-input:focus {
        border-color: rgba(74,158,255,0.5);
        box-shadow: 0 0 0 3px rgba(74,158,255,0.12);
        background: rgba(0,0,0,0.4);
    }

    .btn {
        padding: 15px 28px;
        border-radius: 12px;
        border: 1px solid rgba(74,158,255,0.3);
        background: rgba(74,158,255,0.18);
        color: var(--accent);
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        letter-spacing: 0.4px;
        white-space: nowrap;
    }
    .btn:hover {
        background: rgba(74,158,255,0.28);
        box-shadow: 0 0 24px rgba(74,158,255,0.2);
        transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0) scale(0.98); }

    .hint {
        font-size: 11.5px;
        color: var(--text-mute);
        letter-spacing: 0.2px;
        line-height: 1.7;
        padding: 0 4px;
    }
    .hint code {
        background: rgba(255,255,255,0.05);
        padding: 2px 7px;
        border-radius: 4px;
        color: var(--accent);
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 10.5px;
        margin: 0 2px;
    }

    .divider {
        height: 1px;
        background: var(--border);
        margin: 22px 0 18px;
    }

    .section-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10.5px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-mute);
        margin-bottom: 10px;
    }
    .clear-btn {
        background: transparent;
        border: none;
        color: var(--text-mute);
        font-family: inherit;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.2s;
    }
    .clear-btn:hover { color: var(--red); }

    .history-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        overflow-y: auto;
    }
    .history-list::-webkit-scrollbar { width: 6px; }
    .history-list::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.08);
        border-radius: 3px;
    }

    .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 14px;
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--border);
        border-radius: 9px;
        font-size: 12.5px;
        color: var(--text-dim);
        cursor: pointer;
        transition: 0.2s;
        gap: 12px;
        animation: itemIn 0.4s cubic-bezier(0.2,0.9,0.3,1) backwards;
    }
    @keyframes itemIn {
        0%   { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    .history-item:hover {
        background: rgba(74,158,255,0.06);
        border-color: rgba(74,158,255,0.25);
        color: var(--text);
    }
    .history-item .url {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
    }
    .history-item .rm {
        color: var(--text-mute);
        font-size: 13px;
        padding: 2px 6px;
        transition: 0.2s;
        flex-shrink: 0;
    }
    .history-item .rm:hover { color: var(--red); }

    .empty {
        font-size: 11.5px;
        color: var(--text-mute);
        padding: 14px 0;
        letter-spacing: 0.3px;
        text-align: center;
    }

    .notifs {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
        pointer-events: none;
    }
    .notif {
        background: rgba(20,20,30,0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 16px;
        color: var(--text-dim);
        font-size: 12.5px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        animation: notifIn 0.4s cubic-bezier(0.2,0.9,0.3,1);
        pointer-events: auto;
        max-width: 280px;
        letter-spacing: 0.2px;
    }
    .notif.out { animation: notifOut 0.5s ease forwards; }
    @keyframes notifIn {
        0%   { opacity: 0; transform: translateX(30px) scale(0.9); }
        100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes notifOut {
        0%   { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(30px); }
    }

    @media (max-width: 640px) {
        .app-window { max-width: 100%; }
        .app-window.minimized { max-width: 260px; }
        .app-body { padding: 20px 18px; }
        .titlebar, .app-titlebar { padding: 0 12px; }
        .splash-mark { font-size: 52px; }
        .splash-quote { font-size: 13px; }
        .search-wrap { flex-direction: column; }
        .hero h1 { font-size: 22px; }
        .overlay { padding: 10px; }
    }
</style>
</head>
<body>

<div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>
    <div class="bg-glow g3"></div>
    <div class="bg-noise"></div>
</div>

<div class="splash" id="splash">
    <div class="splash-mark">mirror<span>.</span></div>
    <div class="splash-quote" id="splashQuote">
        Loading...
        <span class="author"></span>
    </div>
    <div class="splash-sub">search · mirror · browse</div>
</div>

<div class="notifs" id="notifs"></div>

<div class="overlay" id="overlay">
    <div class="overlay-window">
        <div class="titlebar">
            <div class="traffic">
                <button class="tl r" onclick="closeOverlay()" title="Close (goes to Google Classroom)">
                    <svg viewBox="0 0 10 10"><path d="M2 2 L8 8 M8 2 L2 8" stroke="#4a0000" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <button class="tl y" onclick="minimizeOverlay()" title="Minimize">
                    <svg viewBox="0 0 10 10"><path d="M2 5 L8 5" stroke="#4a3a00" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <button class="tl g" onclick="restoreOverlay()" title="Restore">
                    <svg viewBox="0 0 10 10"><path d="M2 6.5 L5 3.5 L8 6.5" stroke="#003a00" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
                </button>
            </div>
            <div class="win-title" id="overlayTitle">Viewing...</div>
            <div class="win-actions">
                <button class="win-action" onclick="closeOverlay()">Close (Esc)</button>
            </div>
        </div>
        <div class="window-body">
            <iframe id="overlayFrame" src="about:blank" referrerpolicy="no-referrer" allow="pointer-lock; fullscreen; gamepad; autoplay; clipboard-read; clipboard-write" sandbox="allow-scripts allow-forms allow-presentation allow-pointer-lock allow-popups allow-modals allow-orientation-lock allow-downloads"></iframe>
        </div>
    </div>
</div>

<div class="main" id="main">
    <div class="app-window" id="appWindow">

        <div class="app-titlebar" id="appTitlebar">
            <div class="traffic">
                <button class="tl r" onclick="closeApp()" title="Close (goes to Google Classroom)">
                    <svg viewBox="0 0 10 10"><path d="M2 2 L8 8 M8 2 L2 8" stroke="#4a0000" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <button class="tl y" onclick="minimizeApp()" title="Minimize">
                    <svg viewBox="0 0 10 10"><path d="M2 5 L8 5" stroke="#4a3a00" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <button class="tl g" onclick="restoreApp()" title="Expand">
                    <svg viewBox="0 0 10 10"><path d="M2 6.5 L5 3.5 L8 6.5" stroke="#003a00" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
                </button>
            </div>
            <div class="app-title">
                <span class="dot"></span>
                mirror · search
            </div>
        </div>

        <div class="app-body">

            <div class="hero">
                <h1>mirror<span>.</span></h1>
                <p>paste a link · open it instantly</p>
            </div>

            <div class="search-wrap">
                <input type="text" class="search-input" id="searchInput" placeholder="paste a link or type a url..." autocomplete="off" spellcheck="false">
                <button class="btn" onclick="mirrorLink()">Mirror</button>
            </div>
            <div class="hint">
                examples: <code>example.com</code> <code>https://site.com/page</code> <code>cdn.site.com/file.svg</code>
            </div>

            <div class="divider"></div>

            <div class="section-label">
                <span>Recent mirrors</span>
                <button class="clear-btn" onclick="clearHistory()">Clear all</button>
            </div>
            <div class="history-list" id="historyList"></div>

        </div>

    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   AD BLOCKER
   ═══════════════════════════════════════════════════════ */
(function(){
    'use strict';
    var ALLOWED = [], blocked = 0;

    var _open = window.open;
    window.open = function(url, name, f){
        if (isAllowed(url)) return _open.call(window, url, name, f);
        blocked++;
        console.warn('[LOCKDOWN] blocked window.open:', url);
        return null;
    };

    document.addEventListener('click', function(e){
        if (e.ctrlKey || e.metaKey || e.shiftKey) {
            var el = e.target;
            while (el && el.tagName !== 'A') el = el.parentElement;
            if (el && el.href) {
                e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                blocked++; return false;
            }
        }
        var el = e.target;
        while (el && el.tagName !== 'A') el = el.parentElement;
        if (!el) return;
        var href = el.getAttribute('href') || '';
        var target = el.getAttribute('target') || '';
        if (target === '_blank' || target === '_new' || target === '_top' || target === '_parent') {
            e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
            blocked++; return false;
        }
        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('/')) {
            if (!isAllowed(href)) {
                e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
                blocked++; return false;
            }
        }
    }, true);

    document.addEventListener('auxclick', function(e){
        if (e.button === 1) {
            var el = e.target;
            while (el && el.tagName !== 'A') el = el.parentElement;
            if (el) { e.preventDefault(); e.stopPropagation(); blocked++; }
        }
    }, true);

    window.alert = function(m){ console.warn('[LOCKDOWN] alert blocked:', m); };
    window.confirm = function(){ return false; };

    function isAllowed(url){
        if (!url || !ALLOWED.length) return false;
        try {
            var h = new URL(url, location.origin).hostname.toLowerCase();
            for (var i=0; i<ALLOWED.length; i++)
                if (h === ALLOWED[i] || h.endsWith('.'+ALLOWED[i])) return true;
        } catch(e){ return false; }
        return false;
    }
    window.Lockdown = {
        count: function(){ return blocked; },
        allow: function(d){ if (ALLOWED.indexOf(d) === -1) ALLOWED.push(d); },
        list: function(){ return ALLOWED.slice(); }
    };
    console.log('%c🔒 LOCKDOWN ACTIVE','background:#4a9eff;color:#fff;padding:3px 8px;border-radius:4px;font-weight:600;');
})();

/* ═══════════════════════════════════════════════════════
   MAIN
   ═══════════════════════════════════════════════════════ */
(function(){
    'use strict';

    /* ── QUOTES ────────────────────────────────────── */
    var quotes = [
        {t:"The only way to deal with an unfree world is to become so absolutely free that your very existence is an act of rebellion.",a:"Albert Camus"},
        {t:"Privacy is not an option, and it shouldn't be the price we accept for just getting on the Internet.",a:"Gary Kovacs"},

    /* ── NOTIFICATIONS ─────────────────────────────── */
    var notifsEl = document.getElementById('notifs');
    window.showNotif = function(msg){
        var n = document.createElement('div');
        n.className = 'notif';
        n.textContent = msg;
        notifsEl.appendChild(n);
        setTimeout(function(){
            n.classList.add('out');
            setTimeout(function(){ n.remove(); }, 500);
        }, 2500);
        var all = notifsEl.querySelectorAll('.notif');
        while (all.length > 5) { all[0].remove(); all = notifsEl.querySelectorAll('.notif'); }
    };

    /* ── SPLASH ────────────────────────────────────── */
    var splash = document.getElementById('splash');
    var qEl = document.getElementById('splashQuote');
    var q = quotes[Math.floor(Math.random()*quotes.length)];
    qEl.innerHTML = '“' + q.t + '”<span class="author">— ' + q.a + '</span>';

    setTimeout(function(){
        splash.classList.add('hide');
        document.getElementById('main').classList.add('on');
    }, 3200);

    /* ── OVERLAY ───────────────────────────────────── */
    var overlay = document.getElementById('overlay');
    var overlayFrame = document.getElementById('overlayFrame');
    var overlayTitle = document.getElementById('overlayTitle');
    var overlayWindow = overlay.querySelector('.overlay-window');

    window.openOverlay = function(url, name){
        overlayTitle.textContent = 'Viewing: ' + (name || url);
        overlayFrame.src = url;
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
        setTimeout(function(){ overlayFrame.focus(); }, 300);
        showNotif('Opening ' + (name || url));
    };

    window.closeOverlay = function(){
        overlay.classList.remove('show');
        document.body.style.overflow = '';
        setTimeout(function(){ overlayFrame.src = 'about:blank'; }, 500);
        setTimeout(function(){
            window.location.href = 'https://classroom.google.com';
        }, 300);
    };

    window.minimizeOverlay = function(){
        overlayWindow.style.transition = 'all 0.5s cubic-bezier(0.2,0.9,0.3,1)';
        overlayWindow.style.maxWidth = '340px';
        overlayWindow.style.height = '50px';
        overlayWindow.style.transform = 'translateY(40vh)';
        overlayWindow.style.borderRadius = '12px';

        var body = overlayWindow.querySelector('.window-body');
        var actions = overlayWindow.querySelector('.win-actions');
        if (body) body.style.display = 'none';
        if (actions) actions.style.display = 'none';

        showNotif('Minimized — click green to restore');
    };

    window.restoreOverlay = function(){
        overlayWindow.style.transition = 'all 0.5s cubic-bezier(0.2,0.9,0.3,1)';
        overlayWindow.style.maxWidth = '';
        overlayWindow.style.height = '';
        overlayWindow.style.transform = '';
        overlayWindow.style.borderRadius = '';

        setTimeout(function(){
            var body = overlayWindow.querySelector('.window-body');
            var actions = overlayWindow.querySelector('.win-actions');
            if (body) body.style.display = '';
            if (actions) actions.style.display = '';
        }, 300);

        showNotif('Restored');
    };

    document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' && overlay.classList.contains('show')) closeOverlay();
    });

    /* ── SEARCH / MIRROR ───────────────────────────── */
    var STORE = 'mirror_history_v1';
    var MAX_HIST = 12;

    function getHist(){
        try { return JSON.parse(localStorage.getItem(STORE) || '[]'); }
        catch(e){ return []; }
    }
    function saveHist(l){
        try { localStorage.setItem(STORE, JSON.stringify(l)); } catch(e){}
    }
    function addHist(url){
        var l = getHist().filter(function(x){ return x.url !== url; });
        l.unshift({ url: url, time: Date.now() });
        if (l.length > MAX_HIST) l = l.slice(0, MAX_HIST);
        saveHist(l);
        renderHist();
    }
    function rmHist(url){
        saveHist(getHist().filter(function(x){ return x.url !== url; }));
        renderHist();
    }
    window.clearHistory = function(){
        localStorage.removeItem(STORE);
        renderHist();
        showNotif('History cleared');
    };

    function renderHist(){
        var l = getHist();
        var box = document.getElementById('historyList');
        box.innerHTML = '';
        if (!l.length) {
            box.innerHTML = '<div class="empty">no recent mirrors yet</div>';
            return;
        }
        l.forEach(function(item, i){
            var row = document.createElement('div');
            row.className = 'history-item';
            row.style.animationDelay = (i * 0.03) + 's';

            var url = document.createElement('span');
            url.className = 'url';
            url.textContent = item.url;
            url.onclick = function(){ openOverlay(item.url, shorten(item.url)); };

            var rm = document.createElement('span');
            rm.className = 'rm';
            rm.textContent = '✕';
            rm.onclick = function(e){ e.stopPropagation(); rmHist(item.url); };

            row.appendChild(url);
            row.appendChild(rm);
            box.appendChild(row);
        });
    }

    function shorten(url){
        try {
            var u = new URL(url);
            var h = u.hostname.replace(/^www\./, '');
            return h.length > 28 ? h.slice(0,26) + '…' : h;
        } catch(e){ return url.length > 28 ? url.slice(0,26) + '…' : url; }
    }

    function normalize(input){
        var url = (input || '').trim();
        if (!url) return null;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        try { return new URL(url).href; } catch(e){ return null; }
    }

    window.mirrorLink = function(){
        var inp = document.getElementById('searchInput');
        var url = normalize(inp.value);
        if (!url) { showNotif('Invalid URL'); return; }
        addHist(url);
        openOverlay(url, shorten(url));
        inp.value = '';
    };

    document.getElementById('searchInput').addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); mirrorLink(); }
    });
